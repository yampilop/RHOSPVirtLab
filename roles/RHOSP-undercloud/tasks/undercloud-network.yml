---
- name: UNDERCLOUD NETWORK - Configure gateway network interfaces with NetworkManager
  block:
  - name: UNDERCLOUD NETWORK - Get gateway networks
    set_fact:
      gw_networks: "{{ default_leaf.networks | selectattr('subnet.gateway', 'defined') | list }}"

  - name: UNDERCLOUD NETWORK - Get gateway interfaces from undercloud VM
    set_fact:
      gw_interfaces: "{{ undercloud.kubevirt.network.interfaces | selectattr('bridge', 'in', gw_networks | map(attribute='bridge') | list) | list }}"

  - name: UNDERCLOUD NETWORK - Build bridge to network info mapping
    set_fact:
      bridge_to_gw: "{{ bridge_to_gw | default({}) | combine({item.bridge: item}) }}"
    loop: "{{ gw_networks }}"

  - name: UNDERCLOUD NETWORK - Create configuration script for gateway networks
    copy:
      content: |
        #!/bin/bash
        set -e
        {% for iface in gw_interfaces %}
        {% set gw_net = bridge_to_gw[iface.bridge] %}
        {% set conn_name = gw_net.name | regex_replace('([a-z0-9])([A-Z])', '\1_\2') | lower %}
        {% set ifname = "$(ip link show | grep -i " + iface.mac + " | head -1 | awk '{print $2}' | tr -d ':')" %}
        nmcli connection add type ethernet con-name "{{ conn_name }}" \
          ifname "{{ ifname }}" \
          ipv4.method manual \
          ipv4.addresses "{{ gw_net.subnet.gateway }}/{{ gw_net.subnet.ip_subnet.split('/')[1] }}" \
          connection.autoconnect yes 2>/dev/null || true
        nmcli connection up "{{ conn_name }}" 2>/dev/null || true
        {% endfor %}
      dest: /tmp/configure_gw_networks.sh
      mode: '0755'
    become: true
    delegate_to: undercloud

  - name: UNDERCLOUD NETWORK - Execute gateway network configuration
    command: /tmp/configure_gw_networks.sh
    become: true
    delegate_to: undercloud
    register: gw_result
    changed_when: "'successfully added' in gw_result.stdout.lower()"
    when:
      - default_leaf.ctlplane_subnet.masquerade | default(false)
      - gw_interfaces is defined
      - gw_interfaces | length > 0
