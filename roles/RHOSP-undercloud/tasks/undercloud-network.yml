---
- name: UNDERCLOUD NETWORK - Configure gateway network interfaces with NetworkManager
  block:
  - name: UNDERCLOUD NETWORK - Get gateway networks
    set_fact:
      gw_networks: "{{ default_leaf.networks | selectattr('subnet.gateway', 'defined') | list }}"

  - name: UNDERCLOUD NETWORK - Get gateway interfaces from undercloud VM
    set_fact:
      gw_interfaces: "{{ undercloud.kubevirt.network.interfaces | selectattr('bridge', 'in', gw_networks | map(attribute='bridge') | list) | list }}"

  - name: UNDERCLOUD NETWORK - Build bridge to network info mapping
    set_fact:
      bridge_to_gw: "{{ bridge_to_gw | default({}) | combine({item.bridge: item}) }}"
    loop: "{{ gw_networks }}"

  - name: UNDERCLOUD NETWORK - Build nmcli commands for gateway networks
    set_fact:
      gw_commands: "{{ gw_commands | default([]) + [{'iface': item, 'cmd': 'nmcli connection add type ethernet con-name ' + (bridge_to_gw[item.bridge].name | regex_replace('([a-z0-9])([A-Z])', '\\1_\\2') | lower) + ' ifname $(ip link show | grep -i ' + item.mac + ' | head -1 | awk '\\'''{print $2}'\'' | tr -d ':') ipv4.method manual ipv4.addresses ' + bridge_to_gw[item.bridge].subnet.gateway + '/' + (bridge_to_gw[item.bridge].subnet.cidr.split('/')[1]) + ' connection.autoconnect yes && nmcli connection up ' + (bridge_to_gw[item.bridge].name | regex_replace('([a-z0-9])([A-Z])', '\\1_\\2') | lower)}] }}"
    loop: "{{ gw_interfaces }}"

  - name: UNDERCLOUD NETWORK - Debug gateway network commands
    debug:
      msg: "{{ gw_commands }}"

  - name: UNDERCLOUD NETWORK - Create and bring up NetworkManager profiles
    shell: "{{ item.cmd }}"
    loop: "{{ gw_commands }}"
    become: true
    delegate_to: undercloud
    register: nmcli_result
    failed_when:
      - nmcli_result.rc != 0
      - "'already exists' not in nmcli_result.stderr"
    changed_when: "'already exists' not in nmcli_result.stderr"
  when:
    - default_leaf.ctlplane_subnet.masquerade | default(false)
