---
- name: UNDERCLOUD NETWORK - Initialize gateway networks with indices
  set_fact:
    gateway_networks_with_idx: "{{ (default_leaf.networks | selectattr('subnet.gateway', 'defined') | list | zip(range(2, default_leaf.networks | selectattr('subnet.gateway', 'defined') | list | length + 2)) | map('list') | list) if (default_leaf.ctlplane_subnet.masquerade | default(false)) else [] }}"

- name: UNDERCLOUD NETWORK - Create NetworkManager profiles for gateway networks
  command: |
    nmcli connection add type ethernet con-name {{ item[0].name | regex_replace('([a-z0-9])([A-Z])', '\\1_\\2') | lower }} \
      ifname eth{{ item[1] }} \
      ipv4.method manual \
      ipv4.addresses "{{ item[0].subnet.gateway }}/{{ item[0].subnet.cidr.split('/')[1] }}" \
      connection.autoconnect yes
  loop: "{{ gateway_networks_with_idx }}"
  become: true
  delegate_to: undercloud
  register: nmcli_result
  failed_when:
    - nmcli_result.rc != 0
    - "'already exists' not in nmcli_result.stderr"
  changed_when: "'already exists' not in nmcli_result.stderr"

- name: UNDERCLOUD NETWORK - Bring up gateway network connections
  command: nmcli connection up {{ item[0].name | regex_replace('([a-z0-9])([A-Z])', '\\1_\\2') | lower }}
  loop: "{{ gateway_networks_with_idx }}"
  become: true
  delegate_to: undercloud
