---
- name: UNDERCLOUD NETWORK - Get gateway networks when masquerade enabled
  set_fact:
    gateway_networks: "{{ default_leaf.networks | selectattr('subnet.gateway', 'defined') | list }}"
  when: default_leaf.ctlplane_subnet.masquerade | default(false)

- name: UNDERCLOUD NETWORK - Configure gateway network interfaces with NetworkManager
  block:
  - name: UNDERCLOUD NETWORK - Create NetworkManager profiles for gateway networks
    command: |
      nmcli connection add type ethernet con-name {{ net.name | regex_replace('([a-z0-9])([A-Z])', '\\1_\\2') | lower }} \
        ifname eth{{ loop.index0 + 2 }} \
        ipv4.method manual \
        ipv4.addresses "{{ net.subnet.gateway }}/{{ net.subnet.cidr.split('/')[1] }}" \
        connection.autoconnect yes
    loop: "{{ gateway_networks | default([]) }}"
    loop_control:
      loop_var: net
    become: true
    delegate_to: undercloud
    register: nmcli_result
    failed_when:
      - nmcli_result.rc != 0
      - "'already exists' not in nmcli_result.stderr"
    changed_when: "'already exists' not in nmcli_result.stderr"

  - name: UNDERCLOUD NETWORK - Bring up gateway network connections
    command: nmcli connection up {{ net.name | regex_replace('([a-z0-9])([A-Z])', '\\1_\\2') | lower }}
    loop: "{{ gateway_networks | default([]) }}"
    loop_control:
      loop_var: net
    become: true
    delegate_to: undercloud
  when:
    - default_leaf.ctlplane_subnet.masquerade | default(false)
    - gateway_networks is defined
