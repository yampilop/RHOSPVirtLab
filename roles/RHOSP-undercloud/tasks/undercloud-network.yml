---
- name: UNDERCLOUD NETWORK - Configure gateway network interfaces with NetworkManager
  block:
  - name: UNDERCLOUD NETWORK - Get gateway networks
    set_fact:
      gw_networks: "{{ default_leaf.networks | selectattr('subnet.gateway', 'defined') | list }}"

  - name: UNDERCLOUD NETWORK - Get gateway interfaces from undercloud VM
    set_fact:
      gw_interfaces: "{{ (undercloud.libvirt.network.interfaces if (undercloud.type | default('libvirt')) == 'libvirt' else undercloud.kubevirt.network.interfaces) | selectattr('bridge', 'in', gw_networks | map(attribute='bridge') | list) | list }}"

  - name: UNDERCLOUD NETWORK - Build bridge to network info mapping
    set_fact:
      bridge_to_gw: "{{ bridge_to_gw | default({}) | combine({item.bridge: item}) }}"
    loop: "{{ gw_networks }}"

  - name: UNDERCLOUD NETWORK - Resolve each gateway interface's MAC address to its kernel name and connection name
    set_fact:
      gw_interfaces_resolved: >-
        {{ (gw_interfaces_resolved | default([])) + [item | combine({'ifname': resolved_ifname, 'conn_name': resolved_conn_name})] }}
    vars:
      resolved_ifname: |-
        {% set ns = namespace(found=none) %}
        {% for name in hostvars['undercloud'].ansible_facts.interfaces %}
        {% if hostvars['undercloud'].ansible_facts[name].macaddress | default('') | lower == item.mac | lower %}
        {% set ns.found = name %}
        {% endif %}
        {% endfor %}
        {{ ns.found }}
      resolved_conn_name: "{{ bridge_to_gw[item.bridge].name | regex_replace('([a-z0-9])([A-Z])', '\\1_\\2') | lower }}"
    loop: "{{ gw_interfaces }}"
    when: default_leaf.ctlplane_subnet.masquerade | default(false)

  - name: CHECKS - Ensure every gateway interface's MAC address resolved to a kernel interface name
    fail:
      msg: >-
        ERROR: could not find a network interface with MAC address {{ item.mac }} on the
        undercloud (bridge {{ item.bridge }}). Check vars/machines.yml for a MAC mismatch.
    loop: "{{ gw_interfaces_resolved | default([]) }}"
    when:
      - default_leaf.ctlplane_subnet.masquerade | default(false)
      - item.ifname == 'None'

  - name: UNDERCLOUD NETWORK - Create gateway network connections via NetworkManager
    community.general.nmcli:
      type: ethernet
      conn_name: "{{ item.conn_name }}"
      ifname: "{{ item.ifname }}"
      method4: manual
      ip4: "{{ bridge_to_gw[item.bridge].subnet.gateway }}/{{ bridge_to_gw[item.bridge].subnet.ip_subnet.split('/')[1] }}"
      autoconnect: yes
      state: present
    loop: "{{ gw_interfaces_resolved | default([]) }}"
    loop_control:
      label: "{{ item.conn_name }}"
    become: true
    delegate_to: undercloud
    when: default_leaf.ctlplane_subnet.masquerade | default(false)

  - name: UNDERCLOUD NETWORK - Activate gateway network connections
    command: "nmcli connection up {{ item.conn_name }}"
    loop: "{{ gw_interfaces_resolved | default([]) }}"
    loop_control:
      label: "{{ item.conn_name }}"
    become: true
    delegate_to: undercloud
    register: gw_result
    changed_when: "'successfully activated' in gw_result.stdout.lower()"
    when: default_leaf.ctlplane_subnet.masquerade | default(false)

  - name: UNDERCLOUD NETWORK - Enable IP forwarding when masquerade is enabled
    sysctl:
      name: net.ipv4.ip_forward
      value: '1'
      state: present
      sysctl_set: yes
    become: true
    delegate_to: undercloud
    when: default_leaf.ctlplane_subnet.masquerade | default(false)
