---
# tasks file for RHOSP-undercloud

- name: Verify the RHOSP version selected is supported
  fail:
    msg: "The selected RHOSP version ({{ RHOSP_version }}) is not supported by this role."
  when: RHOSP_version_supported[RHOSP_version] is not defined

# The overcloud public IP (used for PublicVirtualFixedIPs): the default leaf's External
# VIP, else its ctlplane VIP.
- name: NETWORKING - Derive the overcloud public IP
  set_fact:
    overcloud_ip: >-
      {{ (default_leaf.networks | default([]) | selectattr('name', 'equalto', 'External') | list | first).subnet.vip
         if (default_leaf.networks | default([]) | selectattr('name', 'equalto', 'External') | list | length > 0)
         else default_leaf.ctlplane_subnet.vip }}

- name: Wait until cloud-init finishes to grant the sudo access with no password
  raw: test -f /var/lib/cloud/instance/boot-finished
  retries: 30
  register: cmd_res
  changed_when: false
  until: cmd_res is success
  when: not undercloud_is_physical | bool

- name: Configure swap file on the undercloud
  include_role:
    name: geerlingguy.swap

- name: HOSTNAME - Change the hostname
  hostname:
    name: undercloud.localdomain

- name: Red Hat Subscription management
  import_tasks: tasks/subscription.yml

- name: REPOSITORIES - Enable the needed repositories only
  rhsm_repository:
    name: "{{ RHOSP_version_supported[RHOSP_version].undercloud_repos }}"
    purge: yes

- name: MODULES - Enable and configure modules
  copy:
    dest: "/etc/dnf/modules.d/{{ item.name }}.module"
    content: |
      [{{ item.name }}]
      name={{ item.name }}
      stream={{ item.stream }}
      profiles={{ item.profiles }}
      state=enabled
  loop: "{{ RHOSP_version_supported[RHOSP_version].modules }}"

- name: PACKAGES - Install useful tools
  yum:
    name:
      - vim
      - wget
      - bash-completion
    state: latest

- name: PACKAGES - Update all packages
  yum:
    name: '*'
    state: latest
  when: UndercloudFullUpdate | default(true) | bool
  notify: HANDLER - Reboot the machine

# Cloud-init configures both mgmt and eth0 (ctlplane) via network-config.j2, so no need
# for rhel-system-roles.network. A physical undercloud is admin-prepared and left untouched.

- name: CONFIGFILES - Create images directory
  file:
    path: "/home/stack/images"
    owner: stack
    group: stack
    state: directory
  loop:
    - images

- name: PACKAGES - Install needed packages
  yum:
    name: "{{ RHOSP_version_supported[RHOSP_version].packages }}"
    state: latest

- name: IMAGES - Unpack director images
  unarchive:
    src: "{{ item }}"
    dest: "/home/stack/images/"
    owner: stack
    group: stack
    remote_src: yes
  loop: "{{ RHOSP_version_supported[RHOSP_version].images_directories }}"

- name: IMAGES - Check which test images already exist
  stat:
    path: "images/{{ item.name }}"
  loop:
    - url: "{{ CustomRhelImage }}"
      name: "{{ RHOSP_version_supported[RHOSP_version].rhel_image.name }}"
    - url: "{{ CustomCirrOSImage }}"
      name: "cirros.qcow2"
  loop_control:
    label: "{{ item.name }}"
  register: test_images_stat

# Skip any image already present (large files); loops over the stat results.
- name: IMAGES - Download images for testing
  get_url:
    url: "{{ item.item.url }}"
    dest: "images/{{ item.item.name }}"
    owner: stack
    group: stack
    timeout: 30
  loop: "{{ test_images_stat.results }}"
  loop_control:
    label: "{{ item.item.name }}"
  when: not item.stat.exists
  retries: 3
  delay: 10
  register: result
  until: result is not failed

- name: TEMPLATES
  debug:
    msg: "Use --start-at-task TEMPLATES to start from here and re-render the templates."

- name: NETWORKING - Derive the overcloud public IP
  set_fact:
    overcloud_ip: >-
      {{ (default_leaf.networks | default([]) | selectattr('name', 'equalto', 'External') | list | first).subnet.vip
         if (default_leaf.networks | default([]) | selectattr('name', 'equalto', 'External') | list | length > 0)
         else default_leaf.ctlplane_subnet.vip }}

- name: CHECKS - Verify machine profiles
  import_tasks: tasks/profiles.yml

- name: SSH - Ensure the stack ssh directory exists
  file:
    path: /home/stack/.ssh
    state: directory
    owner: stack
    group: stack
    mode: '0700'
  when: true in (deployed_server.values() | map('bool') | list)

- name: CONFIGFILES - Set container images prepare file and custom undercloud parameters
  template:
    src: "{{ item }}.j2"
    dest: "/home/stack/{{ item }}"
    owner: stack
    group: stack
  loop:
    - "containers-prepare-parameter.yaml"
    - "custom-undercloud-params.yaml"

- name: CONFIGFILES - Set undercloud configuration file
  template:
    src: "undercloud.conf.j2"
    dest: "/home/stack/undercloud.conf"
    owner: stack
    group: stack

- name: STACK - Import tasks for the main stack
  include_tasks: tasks/overcloud.yml
  loop:
    - "{{ default_leaf }}"
  loop_control:
    loop_var: leaf

- name: DCN - Import tasks for each DCN Leaf
  include_tasks: tasks/leafs.yml
  loop: "{{ dcn_leafs }}"
  loop_control:
    loop_var: leaf
