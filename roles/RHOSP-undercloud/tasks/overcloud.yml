- name: TEMPLATES - Create directories
  file:
    path: "/home/stack/{{ item }}"
    owner: stack
    group: stack
    state: directory
  loop:
    - templates
    - templates/nic-configs

- name: TEMPLATES - Prepare templates
  template:
    src: "{{ item }}.j2"
    dest: "/home/stack/templates/{{ item }}"
    owner: stack
    group: stack
  loop:
    - instackenv.yaml
    - node-info.yaml
    - custom-overcloud.yaml
    - network_data.yaml
    - custom-network-configuration.yaml
    - custom-ceph.yaml
    - initial-ceph.conf
    - vip_data.yaml
    - overcloud_resources.yaml

- name: TEMPLATES - Prepare the deployed-server port map (16.2 deployed servers)
  template:
    src: "deployed-server-ports.yaml.j2"
    dest: "/home/stack/templates/deployed-server-ports.yaml"
    owner: stack
    group: stack
  when:
    - RHOSP_version < 17.1
    - deployed_server[leaf.name]

- name: TEMPLATES - Create ansible inventory for pre-provisioned nodes
  copy:
    content: |
      all:
        vars:
          ansible_ssh_common_args: '-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null'
        hosts:
      {% set pre_prov_machines = ((libvirt_machines if leaf.hypervisor is defined else []) | selectattr('openstack.leaf', 'equalto', leaf.name if leaf.name != default_leaf.name else omit) | selectattr('pre_provisioned', 'defined') | selectattr('pre_provisioned') | list) + (physical_machines | selectattr('openstack.leaf', 'equalto', leaf.name) | selectattr('pre_provisioned', 'defined') | selectattr('pre_provisioned') | list) + (kubevirt_machines | selectattr('pre_provisioned', 'defined') | selectattr('pre_provisioned') | list) %}
      {% for machine in pre_prov_machines %}
          {{ machine.name }}:
            ansible_host: {{ machine.openstack.ctlplane_ip }}
            ansible_user: {{ RHOSP_version_supported[RHOSP_version].overcloud_ssh_user }}
      {% endfor %}
    dest: "/home/stack/pre_deployment_inventory.yaml"
    owner: stack
    group: stack
  when:
    - deployed_server[leaf.name]

- name: CHECKS - Ensure roles do not mix machine types
  fail:
    msg: |
      ERROR: Role {{ item }} has mixed machine types.
      Roles must contain only one type of machine (libvirt, physical, or kubevirt), not a combination.

      Current configuration:
        Libvirt machines: {{ (libvirt_machines | selectattr('openstack.role', 'equalto', item) | list | length) }}
        Physical machines: {{ (physical_machines | selectattr('openstack.role', 'equalto', item) | list | length) }}
        Kubevirt machines: {{ (kubevirt_machines | selectattr('openstack.role', 'equalto', item) | list | length) }}
  when: |
    ((libvirt_machines | selectattr('openstack.role', 'equalto', item) | list | length) > 0 and
     ((physical_machines | selectattr('openstack.role', 'equalto', item) | list | length) > 0 or
      (kubevirt_machines | selectattr('openstack.role', 'equalto', item) | list | length) > 0))
    or
    ((physical_machines | selectattr('openstack.role', 'equalto', item) | list | length) > 0 and
     (kubevirt_machines | selectattr('openstack.role', 'equalto', item) | list | length) > 0)
  loop: "{{ overcloud_roles | map(attribute='name') | list }}"

- name: SETUP - Augment RoleBridgeMappings with eth0 for kubevirt roles
  set_fact:
    RoleBridgeMappings: |
      {%- set updated_mappings = RoleBridgeMappings | combine({}) -%}
      {%- for role in overcloud_roles | map(attribute='name') | list -%}
      {%- set has_kubevirt = (kubevirt_machines | selectattr('openstack.role', 'equalto', role | lower) | list | length) > 0 -%}
      {%- if role in updated_mappings -%}
      {%- set current_bridges = updated_mappings[role] -%}
      {%- else -%}
      {%- set current_bridges = updated_mappings['Default'] -%}
      {%- endif -%}
      {%- set new_bridges = current_bridges + ([{'type': 'interface', 'name': 'eth0', 'use_dhcp': True}] if has_kubevirt else []) -%}
      {%- set _ = updated_mappings.update({role: new_bridges}) -%}
      {%- endfor -%}
      {{ updated_mappings }}

- name: DEBUG - Check kubevirt_machines and their roles
  debug:
    msg: |
      Kubevirt machines: {{ kubevirt_machines | map(attribute='name') | list }}
      Kubevirt roles: {{ kubevirt_machines | map(attribute='openstack.role') | list }}
      Controller kubevirt machines: {{ (kubevirt_machines | selectattr('openstack.role', 'equalto', 'controller') | list) | length }}

- name: DEBUG - Show RoleBridgeMappings for Controller role
  debug:
    msg: "Controller bridges: {{ RoleBridgeMappings['Controller'] | default(RoleBridgeMappings['Default']) | to_nice_json }}"

- name: TEMPLATES - Prepare the nic-configs templates
  template:
    src: "nic-configs/nic-config.yaml.j2"
    dest: "/home/stack/templates/nic-configs/{{ item.profile }}.yaml"
    owner: stack
    group: stack
  when:
    - RHOSP_version < 17.1
    - roles_count[default_leaf.name][item.name] > 0
  loop: "{{ overcloud_roles }}"

- name: TEMPLATES - RHOSP >= 17.1 nic-config files
  template:
    src: "templates/nic-configs/nic-config.j2"
    dest: "/home/stack/templates/nic-configs/{{ item.profile }}.j2"
    owner: stack
    group: stack
  when:
    - RHOSP_version >= 17.1
    - roles_count[default_leaf.name][item.name] > 0
  loop: "{{ overcloud_roles }}"

- name: SETUP - Re-augment RoleBridgeMappings with eth0 for kubevirt roles (post-templates)
  set_fact:
    RoleBridgeMappings: |
      {%- set updated_mappings = RoleBridgeMappings | combine({}) -%}
      {%- for role in overcloud_roles | map(attribute='name') | list -%}
      {%- set has_kubevirt = (kubevirt_machines | selectattr('openstack.role', 'equalto', role | lower) | list | length) > 0 -%}
      {%- if role in updated_mappings -%}
      {%- set current_bridges = updated_mappings[role] -%}
      {%- else -%}
      {%- set current_bridges = updated_mappings['Default'] -%}
      {%- endif -%}
      {%- set new_bridges = current_bridges + ([{'type': 'interface', 'name': 'eth0', 'use_dhcp': True}] if has_kubevirt else []) -%}
      {%- set _ = updated_mappings.update({role: new_bridges}) -%}
      {%- endfor -%}
      {{ updated_mappings }}

- name: SCRIPTS - Prepare the scripts
  template:
    src: "{{ item }}.j2"
    dest: "/home/stack/{{ item }}"
    mode: "755"
    owner: stack
    group: stack
  loop:
    - pre_deployment.sh
    - deploy.sh
    - post_deployment.sh
    - undeploy.sh