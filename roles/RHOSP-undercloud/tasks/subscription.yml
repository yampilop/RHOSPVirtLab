- name: SUBSCRIPTION - Check subscription-manager status
  shell: "subscription-manager status"
  register: status
  changed_when: false
  failed_when: false

- name: SUBSCRIPTION - Register, attach and set release (with OrgID and Activation Key)
  redhat_subscription:
    state: present
    org_id: "{{ rh_orgid }}"
    activationkey: "{{ rh_activationkey }}"
    pool: "{% if rh_pool is defined %}{{ rh_pool }}{% else %}Red Hat OpenStack{% endif %}"
    release: "{{ RHOSP_version_supported[RHOSP_version].rhel_release }}"
    force_register: yes
  when: (status is not search('Current')) and (status is not search('Content Access Mode')) and ( (rh_orgid is defined) and (rh_activationkey is defined) )
  failed_when: false

- name: SUBSCRIPTION - Register, attach and set release (with username and password)
  redhat_subscription:
    state: present
    username: "{{ rh_username }}"
    password: "{{ rh_password }}"
    pool: "{% if rh_pool is defined %}{{ rh_pool }}{% else %}Red Hat OpenStack{% endif %}"
    release: "{{ RHOSP_version_supported[RHOSP_version].rhel_release }}"
    force_register: yes
  when: (status is not search('Current')) and (status is not search('Content Access Mode')) and ( (rh_orgid is not defined) or (rh_activationkey is not defined) )
  failed_when: false

- name: SUBSCRIPTION - Verify the undercloud is registered
  # Under Simple Content Access (SCA, now the default for all Red Hat orgs) there are no
  # attached entitlements, so `subscription-manager status` reports "Overall Status:
  # Unknown"/"Disabled" and rc 1 (never "Current"). Confirm the outcome via `identity`
  # instead, which returns rc 0 when the host is registered regardless of SCA state.
  shell: "subscription-manager identity"
  register: status_new
  changed_when: false
  failed_when: status_new.rc != 0
