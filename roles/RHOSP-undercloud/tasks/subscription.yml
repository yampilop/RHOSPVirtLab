- name: SUBSCRIPTION - Check whether the undercloud is already registered
  command: "subscription-manager identity"
  register: sub_identity
  changed_when: false
  failed_when: false

- name: SUBSCRIPTION - Register the undercloud (with OrgID and Activation Key)
  redhat_subscription:
    state: present
    org_id: "{{ rh_orgid }}"
    activationkey: "{{ rh_activationkey }}"
    # Only attach a pool when one is explicitly configured. Under Simple Content Access
    # (SCA, the default for hosted Red Hat orgs) there are no pools and attaching is
    # disabled, so omit it and let registration alone grant content.
    pool: "{{ rh_pool | default(omit) }}"
    release: "{{ RHOSP_version_supported[RHOSP_version].rhel_release }}"
    force_register: yes
  register: reg_result_ak
  failed_when: false
  when:
    - sub_identity.rc != 0
    - rh_orgid is defined
    - rh_activationkey is defined

- name: SUBSCRIPTION - Check if registration with module succeeded
  command: "subscription-manager identity"
  register: sub_identity_ak
  changed_when: false
  failed_when: false
  when:
    - sub_identity.rc != 0
    - rh_orgid is defined
    - rh_activationkey is defined

- name: SUBSCRIPTION - Register the undercloud with raw (with OrgID and Activation Key, fallback)
  raw: sudo subscription-manager register --org="{{ rh_orgid }}" --activationkey="{{ rh_activationkey }}" --force && sudo subscription-manager release --set="{{ RHOSP_version_supported[RHOSP_version].rhel_release }}"{% if rh_pool is defined and rh_pool %} && sudo subscription-manager attach --pool="{{ rh_pool }}"{% endif %}
  when:
    - sub_identity.rc != 0
    - rh_orgid is defined
    - rh_activationkey is defined
    - sub_identity_ak.rc != 0

- name: SUBSCRIPTION - Register the undercloud (with username and password)
  redhat_subscription:
    state: present
    username: "{{ rh_username }}"
    password: "{{ rh_password }}"
    pool: "{{ rh_pool | default(omit) }}"
    release: "{{ RHOSP_version_supported[RHOSP_version].rhel_release }}"
    force_register: yes
  register: reg_result_up
  failed_when: false
  when:
    - sub_identity.rc != 0
    - (rh_orgid is not defined) or (rh_activationkey is not defined)

- name: SUBSCRIPTION - Check if registration with module succeeded (username/password)
  command: "subscription-manager identity"
  register: sub_identity_up
  changed_when: false
  failed_when: false
  when:
    - sub_identity.rc != 0
    - (rh_orgid is not defined) or (rh_activationkey is not defined)

- name: SUBSCRIPTION - Register the undercloud with raw (with username and password, fallback)
  raw: sudo subscription-manager register --username="{{ rh_username }}" --password="{{ rh_password }}" --force && sudo subscription-manager release --set="{{ RHOSP_version_supported[RHOSP_version].rhel_release }}"{% if rh_pool is defined and rh_pool %} && sudo subscription-manager attach --pool="{{ rh_pool }}"{% endif %}
  when:
    - sub_identity.rc != 0
    - (rh_orgid is not defined) or (rh_activationkey is not defined)
    - sub_identity_up.rc != 0

- name: SUBSCRIPTION - Verify the undercloud is registered
  # Registration-based check, immune to SCA (where `subscription-manager status` reports
  # "Overall Status: Unknown"); rc is non-zero only when the host is not registered.
  command: "subscription-manager identity"
  changed_when: false
