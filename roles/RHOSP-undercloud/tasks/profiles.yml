- name: PROFILES - Calculate roles count to use in the entire playbook
  set_fact:
    roles_count: |-
      {
      {%- for leaf in ([ DefaultLeaf0 ] + DCNLeafs) %}
        {{ leaf.name }}:
        {
        {%- for role in overcloud_roles %}
          {{ role.name }}: {{ (physical_machines | selectattr("openstack.role", "equalto", role.profile) | selectattr("openstack.leaf", "equalto", leaf.name) | list | count) + (libvirt_machines | selectattr("openstack.role", "equalto", role.profile) | selectattr("libvirt.hypervisor", "in", leaf.hypervisor) | list | count) }},
        {%- endfor %}
        },
      {%- endfor %}
      }

- name: PROFILES - Parse roles count fact
  set_fact:
    roles_count: "{{ roles_count | from_yaml }}"

- name: PROFILES - Determine deployed-server (pre-provisioned) mode per leaf
  set_fact:
    deployed_server: |-
      {
      {%- for leaf in ([ DefaultLeaf0 ] + DCNLeafs) %}
        {{ leaf.name }}: {{
          ((libvirt_machines | selectattr('libvirt.hypervisor', 'in', leaf.hypervisor) | selectattr('pre_provisioned', 'defined') | selectattr('pre_provisioned') | list | count)
           + (physical_machines | selectattr('openstack.leaf', 'equalto', leaf.name) | selectattr('pre_provisioned', 'defined') | selectattr('pre_provisioned') | list | count)) > 0
        }},
      {%- endfor %}
      }

- name: PROFILES - Parse deployed-server fact
  set_fact:
    deployed_server: "{{ deployed_server | from_yaml }}"

- name: PROFILES - Ensure deployed-server mode is all-or-nothing per leaf
  fail:
    msg: >-
      ERROR in leaf {{ item.name }}: pre-provisioned (deployed-server) and
      ironic-provisioned overcloud nodes cannot be mixed in the same stack. Set
      pre_provisioned consistently for all overcloud nodes in this leaf.
  when:
    - deployed_server[item.name] | bool
    - ((libvirt_machines | selectattr('libvirt.hypervisor', 'in', item.hypervisor) | rejectattr('pre_provisioned', 'defined') | list | count)
       + (libvirt_machines | selectattr('libvirt.hypervisor', 'in', item.hypervisor) | selectattr('pre_provisioned', 'defined') | rejectattr('pre_provisioned') | list | count)
       + (physical_machines | selectattr('openstack.leaf', 'equalto', item.name) | rejectattr('pre_provisioned', 'defined') | list | count)
       + (physical_machines | selectattr('openstack.leaf', 'equalto', item.name) | selectattr('pre_provisioned', 'defined') | rejectattr('pre_provisioned') | list | count)) > 0
  loop: "{{ [ DefaultLeaf0 ] + DCNLeafs }}"

- name: PROFILES - Ensure pre-provisioned overcloud nodes define a valid ctlplane_ip
  fail:
    msg: >-
      ERROR in {{ item.name }}: pre-provisioned overcloud nodes require
      openstack.ctlplane_ip inside {{ DefaultLeaf0.subnet.cidr }} and outside the
      DHCP ({{ DefaultLeaf0.subnet.dhcp_start }}-{{ DefaultLeaf0.subnet.dhcp_end }}),
      inspection ({{ DefaultLeaf0.subnet.inspection_iprange }}) and reserved
      (.1-.3, .254) ranges.
  vars:
    ctlplane_prefix: "{{ DefaultLeaf0.subnet.cidr.split('/')[0].rsplit('.', 1)[0] }}"
  when:
    - item.pre_provisioned | default(false)
    - (item.openstack.ctlplane_ip is not defined)
      or (item.openstack.ctlplane_ip.rsplit('.', 1)[0] != ctlplane_prefix)
      or ((item.openstack.ctlplane_ip.rsplit('.', 1)[1] | int) in [0, 1, 2, 3, 254, 255])
      or ((item.openstack.ctlplane_ip.rsplit('.', 1)[1] | int) >= (DefaultLeaf0.subnet.dhcp_start.rsplit('.', 1)[1] | int) and (item.openstack.ctlplane_ip.rsplit('.', 1)[1] | int) <= (DefaultLeaf0.subnet.dhcp_end.rsplit('.', 1)[1] | int))
      or ((item.openstack.ctlplane_ip.rsplit('.', 1)[1] | int) >= (DefaultLeaf0.subnet.inspection_iprange.split(',')[0].rsplit('.', 1)[1] | int) and (item.openstack.ctlplane_ip.rsplit('.', 1)[1] | int) <= (DefaultLeaf0.subnet.inspection_iprange.split(',')[1].rsplit('.', 1)[1] | int))
  loop: "{{ libvirt_machines + physical_machines }}"

- name: PROFILES - Ensure ctlplane_ip is unique across deployed servers
  vars:
    ctlplane_ips: "{{ (libvirt_machines + physical_machines) | selectattr('pre_provisioned', 'defined') | selectattr('pre_provisioned') | map(attribute='openstack.ctlplane_ip') | list }}"
  fail:
    msg: "ERROR: duplicate openstack.ctlplane_ip found among pre-provisioned overcloud nodes ({{ ctlplane_ips }})."
  when: (ctlplane_ips | length) != (ctlplane_ips | unique | list | length)

- name: PROFILES - Check all libvirt machine profiles are virtual
  fail:
    msg: "ERROR in vm {{ item.name }}: Only virtual capable profiles can be used for libvirt machines."
  when:
    - not ((overcloud_roles | selectattr("profile", "equalto", item.openstack.role) | list | first).virtual | bool)
  loop: "{{ libvirt_machines }}"

- name: PROFILES - Check only the right profiles are used in libvirt machines for leafs
  fail:
    msg: "ERROR in vm {{ item.name }}: Only distributed capable profiles can be used in leafs."
  when:
    - item.libvirt.hypervisor not in DefaultLeaf0.hypervisor
    - not ((overcloud_roles | selectattr("profile", "equalto", item.openstack.role) | list | first).distributed | bool)
  loop: "{{ libvirt_machines }}"

- name: PROFILES - Check only the right profiles are used in physical machines for leafs
  fail:
    msg: "ERROR in physical {{ item.name }}: Only distributed capable profiles can be used in leafs."
  when:
    - item.openstack.leaf != DefaultLeaf0.name
    - not ((overcloud_roles | selectattr("profile", "equalto", item.openstack.role) | list | first).distributed | bool)
  loop: "{{ physical_machines }}"

- name: PROFILES - Check no more than the max amount of nodes for a profile is used in each leaf
  fail:
    msg: "No more than {{ item.1.max }} nodes are allowed for the role {{ item.1.name }} in leaf {{ item.0.name }}."
  when:
    - item.1.max is defined
    - roles_count[item.0.name][item.1.name] > item.1.max
  with_nested:
    - "{{ [ DefaultLeaf0 ] + DCNLeafs }}"
    - "{{ overcloud_roles }}"