---
# vars file for RHOSP-undercloud

# Convenience views over `machines` (overcloud nodes only; the undercloud is separate).
libvirt_machines: "{{ machines | selectattr('type', 'equalto', 'libvirt') | list }}"
physical_machines: "{{ machines | selectattr('type', 'equalto', 'physical') | list }}"

# True when the undercloud is an admin-prepared physical host rather than a libvirt VM.
undercloud_is_physical: "{{ (undercloud.type | default('libvirt')) == 'physical' }}"

# Derived views over `leafs`: the control-plane leaf `overcloud` and the DCN leafs.
# Selected by name (not list position), so authoring order does not matter.
default_leaf: "{{ leafs | selectattr('name', 'equalto', 'overcloud') | first }}"
dcn_leafs: "{{ leafs | rejectattr('name', 'equalto', 'overcloud') | list }}"

# Flat view of the default leaf's networks. The deployment_environment `Variable`
# gate is resolved with `lookup('vars', ...)`, which takes a plain variable name and
# does not traverse dotted paths, so a `default_leaf.networks` reference cannot be used
# there directly (16.2 network-isolation / network-environment env files).
default_leaf_networks: "{{ default_leaf.networks | default([]) }}"

# Management (NAT) gateway, used as pm_addr for localhost libvirt VMs in instackenv.
# Duplicated here because the virt-infra role vars are not visible in this play; keep in
# sync with roles/RHOSP-virt-infra/vars/main.yml (libvirt_management_network.ipv4.address).
libvirt_management_network:
  ipv4:
    address: '192.168.250.1'

RHEL_version_supported:
  '7.9':
  '8.4':
  '9.6':
  '10.2':

overcloud_roles:
  - name: Controller
    profile: controller
    virtual: True
    distributed: False
    max: 3
  - name: Compute
    profile: compute
    virtual: True
    distributed: True
  - name: ComputeOvsDpdk
    profile: computeovsdpdk
    virtual: False
    distributed: False
  - name: ComputeOvsDpdkSriov
    profile: computeovsdpdksriov
    virtual: False
    distributed: False
  - name: ComputeSriov
    profile: computesriov
    virtual: False
    distributed: False
  - name: ComputeOvsHwOffload
    profile: computeovshwoffload
    virtual: False
    distributed: False
    copy_from: Compute
  - name: CephStorage
    profile: cephstorage
    virtual: True
    distributed: True
  - name: ComputeHCI
    profile: computehci
    virtual: True
    distributed: False
  - name: ComputeInstanceHA
    profile: computeinstanceha
    virtual: True
    distributed: True
  - name: DistributedCompute
    profile: distributedcompute
    virtual: True
    distributed: True
    max: 3
  - name: DistributedComputeScaleOut
    profile: distributedcomputescaleout
    virtual: True
    distributed: True
  - name: DistributedComputeHCI
    profile: distributedcomputehci
    virtual: True
    distributed: True
    max: 3
  - name: DistributedComputeHCIScaleOut
    profile: distributedcomputehciscaleout
    virtual: True
    distributed: True
  - name: CephAll
    profile: cephall
    virtual: True
    distributed: True
    max: 3

# Environment files added to the deploy command. Per entry: file; absolute_path (full
# path vs relative to the leaf templates dir); version (list); DCN (DCN-only);
# Leafs (All|Default|NotDefault); DeployedServer (include only in deployed-server mode).
deployment_environment:
  - file: overcloud-baremetal-deployed.yaml
    absolute_path: False
    version: [ 17.1 ]
    DCN: False
    Leafs: All
  - file: overcloud-networks-deployed.yaml
    absolute_path: False
    version: [ 17.1 ]
    DCN: False
    Leafs: All
  - file: overcloud-vip-deployed.yaml
    absolute_path: False
    version: [ 17.1 ]
    DCN: False
    Leafs: All
  - file: node-info.yaml
    absolute_path: False
    version: [ 16.2 ]
    DCN: False
    Leafs: All
  - file: /usr/share/openstack-tripleo-heat-templates/environments/deployed-server-environment.yaml
    absolute_path: True
    version: [ 16.2 ]
    DCN: False
    Leafs: All
    DeployedServer: True
  - file: deployed-server-ports.yaml
    absolute_path: False
    version: [ 16.2 ]
    DCN: False
    Leafs: All
    DeployedServer: True
  - file: /home/stack/containers-prepare-parameter.yaml
    absolute_path: True
    version: [ 17.1, 16.2 ]
    DCN: False
    Leafs: All
  - file: overcloud-images.yaml
    absolute_path: False
    version: [ 17.1, 16.2 ]
    DCN: False
    Leafs: All
  - file: /usr/share/openstack-tripleo-heat-templates/environments/nova-az-config.yaml
    absolute_path: True
    version: [ 17.1, 16.2 ]
    DCN: True
    Leafs: All
  - file: /home/stack/templates/overcloud-export.yaml
    absolute_path: True
    version: [ 16.2 ]
    DCN: True
    Leafs: NotDefault
  - file: /home/stack/overcloud-deploy/{{ default_leaf.name }}/overcloud-export.yaml
    absolute_path: True
    version: [ 17.1 ]
    DCN: True
    Leafs: NotDefault
  - file: /usr/share/openstack-tripleo-heat-templates/environments/enable-swap.yaml
    absolute_path: True
    version: [ 17.1, 16.2 ]
    DCN: False
    Leafs: All
  - file: /usr/share/openstack-tripleo-heat-templates/environments/network-isolation.yaml
    absolute_path: True
    version: [ 16.2 ]
    DCN: False
    Leafs: All
    Variable: default_leaf_networks
  - file: /usr/share/openstack-tripleo-heat-templates/environments/network-environment.yaml
    absolute_path: True
    version: [ 16.2 ]
    DCN: False
    Leafs: All
    Variable: default_leaf_networks
  - file: "/usr/share/openstack-tripleo-heat-templates/environments/services/neutron-{{ NeutronDriver }}-dpdk.yaml"
    absolute_path: True
    version: [ 17.1, 16.2 ]
    DCN: False
    Leafs: All
    Roles: [ 'ComputeOvsDpdk', 'ComputeOvsDpdkSriov' ]
  - file: "/usr/share/openstack-tripleo-heat-templates/environments/services/neutron-{{ NeutronDriver }}-dvr{{ '-ha' if NeutronDriver == 'ovn' else '' }}.yaml"
    absolute_path: True
    version: [ 17.1, 16.2 ]
    DCN: False
    Leafs: All
  - file: "/usr/share/openstack-tripleo-heat-templates/environments/services/neutron-{{ NeutronDriver }}-sriov.yaml"
    absolute_path: True
    version: [ 17.1, 16.2 ]
    DCN: False
    Leafs: All
    Roles: [ 'ComputeOvsDpdkSriov', 'ComputeSriov', 'ComputeOvsHwOffload' ]
  - file: /usr/share/openstack-tripleo-heat-templates/environments/low-memory-usage.yaml
    absolute_path: True
    version: [ 17.1, 16.2 ]
    DCN: False
    Leafs: Default
