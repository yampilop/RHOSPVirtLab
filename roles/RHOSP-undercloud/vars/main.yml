---
# vars file for RHOSP-undercloud

# Convenience views over the overcloud machines list. `machines` holds only the
# overcloud nodes; the undercloud is defined separately in the top-level
# `undercloud` variable and is intentionally NOT part of these views (this role
# authors the overcloud, so it never needs to iterate the undercloud).
libvirt_machines: "{{ machines | selectattr('type', 'equalto', 'libvirt') | list }}"
physical_machines: "{{ machines | selectattr('type', 'equalto', 'physical') | list }}"

# Whether the undercloud is a pre-existing physical host (admin-prepared) rather
# than a libvirt VM created by the virt-infra role.
undercloud_is_physical: "{{ (undercloud.type | default('libvirt')) == 'physical' }}"

RHEL_version_supported:
  '7.9':
  '8.4':
  '9.6':
  '10.2':

overcloud_roles:
  - name: Controller
    profile: controller
    virtual: True
    distributed: False
    max: 3
  - name: Compute
    profile: compute
    virtual: True
    distributed: True
  - name: ComputeOvsDpdk
    profile: computeovsdpdk
    virtual: False
    distributed: False
  - name: ComputeOvsDpdkSriov
    profile: computeovsdpdksriov
    virtual: False
    distributed: False
  - name: ComputeSriov
    profile: computesriov
    virtual: False
    distributed: False
  - name: ComputeOvsHwOffload
    profile: computeovshwoffload
    virtual: False
    distributed: False
    copy_from: Compute
  - name: CephStorage
    profile: cephstorage
    virtual: True
    distributed: True
  - name: ComputeHCI
    profile: computehci
    virtual: True
    distributed: False
  - name: ComputeInstanceHA
    profile: computeinstanceha
    virtual: True
    distributed: True
  - name: DistributedCompute
    profile: distributedcompute
    virtual: True
    distributed: True
    max: 3
  - name: DistributedComputeScaleOut
    profile: distributedcomputescaleout
    virtual: True
    distributed: True
  - name: DistributedComputeHCI
    profile: distributedcomputehci
    virtual: True
    distributed: True
    max: 3
  - name: DistributedComputeHCIScaleOut
    profile: distributedcomputehciscaleout
    virtual: True
    distributed: True
  - name: CephAll
    profile: cephall
    virtual: True
    distributed: True
    max: 3

# Environment files to include in deploy command:
#  - file: Name of the file
#    absolute_path: True if the file name is a full path, False if it's relative to the leaf templates directory
#    version: List of versions where the file will be included
#    DCN: True if this will only be include in DCN deployments
#    Leafs: All(Include in all the leafs)|Default(Include only in the default leaf)|NotDefault(Include only in the DCN leafs)
#    DeployedServer: True to include the file only when the leaf runs in deployed-server (pre-provisioned) mode
deployment_environment:
  - file: overcloud-baremetal-deployed.yaml
    absolute_path: False
    version: [ 17.1 ]
    DCN: False
    Leafs: All
  - file: overcloud-networks-deployed.yaml
    absolute_path: False
    version: [ 17.1 ]
    DCN: False
    Leafs: All
  - file: overcloud-vip-deployed.yaml
    absolute_path: False
    version: [ 17.1 ]
    DCN: False
    Leafs: All
  - file: node-info.yaml
    absolute_path: False
    version: [ 16.2 ]
    DCN: False
    Leafs: All
  - file: /usr/share/openstack-tripleo-heat-templates/environments/deployed-server-environment.yaml
    absolute_path: True
    version: [ 16.2 ]
    DCN: False
    Leafs: All
    DeployedServer: True
  - file: deployed-server-ports.yaml
    absolute_path: False
    version: [ 16.2 ]
    DCN: False
    Leafs: All
    DeployedServer: True
  - file: /home/stack/containers-prepare-parameter.yaml
    absolute_path: True
    version: [ 17.1, 16.2 ]
    DCN: False
    Leafs: All
  - file: overcloud-images.yaml
    absolute_path: False
    version: [ 17.1, 16.2 ]
    DCN: False
    Leafs: All
  - file: /usr/share/openstack-tripleo-heat-templates/environments/nova-az-config.yaml
    absolute_path: True
    version: [ 17.1, 16.2 ]
    DCN: True
    Leafs: All
  - file: /home/stack/templates/overcloud-export.yaml
    absolute_path: True
    version: [ 16.2 ]
    DCN: True
    Leafs: NotDefault
  - file: /home/stack/overcloud-deploy/{{ DefaultLeaf0.name }}/overcloud-export.yaml
    absolute_path: True
    version: [ 17.1 ]
    DCN: True
    Leafs: NotDefault
  - file: /usr/share/openstack-tripleo-heat-templates/environments/enable-swap.yaml
    absolute_path: True
    version: [ 17.1, 16.2 ]
    DCN: False
    Leafs: All
  - file: /usr/share/openstack-tripleo-heat-templates/environments/network-isolation.yaml
    absolute_path: True
    version: [ 16.2 ]
    DCN: False
    Leafs: All
    Variable: DefaultLeaf0.networks
  - file: /usr/share/openstack-tripleo-heat-templates/environments/network-environment.yaml
    absolute_path: True
    version: [ 16.2 ]
    DCN: False
    Leafs: All
    Variable: DefaultLeaf0.networks
  - file: "/usr/share/openstack-tripleo-heat-templates/environments/services/neutron-{{ NeutronDriver }}-dpdk.yaml"
    absolute_path: True
    version: [ 17.1, 16.2 ]
    DCN: False
    Leafs: All
    Roles: [ 'ComputeOvsDpdk', 'ComputeOvsDpdkSriov' ]
  - file: "/usr/share/openstack-tripleo-heat-templates/environments/services/neutron-{{ NeutronDriver }}-dvr{{ '-ha' if NeutronDriver == 'ovn' else '' }}.yaml"
    absolute_path: True
    version: [ 17.1, 16.2 ]
    DCN: False
    Leafs: All
  - file: "/usr/share/openstack-tripleo-heat-templates/environments/services/neutron-{{ NeutronDriver }}-sriov.yaml"
    absolute_path: True
    version: [ 17.1, 16.2 ]
    DCN: False
    Leafs: All
    Roles: [ 'ComputeOvsDpdkSriov', 'ComputeSriov', 'ComputeOvsHwOffload' ]
  - file: /usr/share/openstack-tripleo-heat-templates/environments/low-memory-usage.yaml
    absolute_path: True
    version: [ 17.1, 16.2 ]
    DCN: False
    Leafs: Default
    Variable: LowMemUsage
  - file: /usr/share/openstack-tripleo-heat-templates/environments/services/octavia.yaml
    absolute_path: True
    version: [ 17.1, 16.2 ]
    DCN: False
    Leafs: All
    Variable: DeployOctavia
  - file: /usr/share/openstack-tripleo-heat-templates/environments/enable-designate.yaml
    absolute_path: True
    version: [ 17.1 ]
    DCN: False
    Leafs: All
    Variable: DeployDesignate
  - file: /usr/share/openstack-tripleo-heat-templates/environments/services/frr.yaml
    absolute_path: True
    version: [ 17.1 ]
    DCN: False
    Leafs: All
    Variable: DeployFrr
  - file: custom-network-configuration.yaml
    absolute_path: False
    version: [ 17.1, 16.2 ]
    DCN: False
    Leafs: All
  - file: /usr/share/openstack-tripleo-heat-templates/environments/cephadm/cephadm.yaml
    absolute_path: True
    version: [ 17.1 ]
    DCN: False
    Leafs: All
    Roles: [ 'CephStorage', 'CephAll', 'ComputeHCI', 'DistributedComputeHCI', 'DistributedComputeHCIScaleOut' ]
  - file: /usr/share/openstack-tripleo-heat-templates/environments/cephadm/ceph-mds.yaml
    absolute_path: True
    version: [ 17.1 ]
    DCN: False
    Leafs: All
    Roles: [ 'CephStorage', 'CephAll', 'ComputeHCI', 'DistributedComputeHCI', 'DistributedComputeHCIScaleOut' ]
  - file: /usr/share/openstack-tripleo-heat-templates/environments/cinder-backup.yaml
    absolute_path: True
    version: [ 17.1 ]
    DCN: False
    Leafs: All
    Roles: [ 'CephStorage', 'CephAll', 'ComputeHCI', 'DistributedComputeHCI', 'DistributedComputeHCIScaleOut' ]
  - file: deployed-ceph.yaml
    absolute_path: False
    version: [ 17.1 ]
    DCN: False
    Leafs: All
    Roles: [ 'CephStorage', 'CephAll', 'ComputeHCI', 'DistributedComputeHCI', 'DistributedComputeHCIScaleOut' ]
  - file: /usr/share/openstack-tripleo-heat-templates/environments/ceph-ansible/ceph-ansible.yaml
    absolute_path: True
    version: [ 16.2 ]
    DCN: False
    Leafs: All
    Roles: [ 'CephStorage', 'CephAll', 'ComputeHCI', 'DistributedComputeHCI', 'DistributedComputeHCIScaleOut' ]
  - file: /usr/share/openstack-tripleo-heat-templates/environments/ceph-ansible/ceph-rgw.yaml
    absolute_path: True
    version: [ 16.2 ]
    DCN: False
    Leafs: Default
    Roles: [ 'CephStorage', 'CephAll', 'ComputeHCI', 'DistributedComputeHCI', 'DistributedComputeHCIScaleOut' ]
  - file: /usr/share/openstack-tripleo-heat-templates/environments/ceph-ansible/ceph-mds.yaml
    absolute_path: True
    version: [ 16.2 ]
    DCN: False
    Leafs: Default
    Roles: [ 'CephStorage', 'CephAll', 'ComputeHCI', 'DistributedComputeHCI', 'DistributedComputeHCIScaleOut' ]
  - file: /usr/share/openstack-tripleo-heat-templates/environments/cinder-backup.yaml
    absolute_path: True
    version: [ 16.2 ]
    DCN: False
    Leafs: Default
    Roles: [ 'CephStorage', 'CephAll', 'ComputeHCI', 'DistributedComputeHCI', 'DistributedComputeHCIScaleOut' ]
  - file: /usr/share/openstack-tripleo-heat-templates/environments/dcn-hci.yaml
    absolute_path: True
    version: [ 16.2 ]
    DCN: False
    Leafs: NotDefault
    Roles: [ 'CephStorage', 'CephAll', 'ComputeHCI', 'DistributedComputeHCI', 'DistributedComputeHCIScaleOut' ]
  - file: /usr/share/openstack-tripleo-heat-templates/environments/dcn-storage.yaml
    absolute_path: True
    version: [ 17.1, 16.2 ]
    DCN: True
    Leafs: All
    Roles: [ 'CephStorage', 'CephAll', 'ComputeHCI', 'DistributedComputeHCI', 'DistributedComputeHCIScaleOut' ]
  - file: "/home/stack/templates/overcloud_ceph_external.yaml"
    absolute_path: True
    version: [ 16.2 ]
    DCN: False
    Leafs: NotDefault
    Roles: [ 'CephStorage', 'CephAll', 'ComputeHCI', 'DistributedComputeHCI', 'DistributedComputeHCIScaleOut' ]
