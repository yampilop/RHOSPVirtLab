    - Tenant
    - External
  ComputeOvsDpdkSriov:
    - InternalApi
    - Storage
    - Tenant
    - External
  ComputeSriov:
    - InternalApi
    - Storage
    - Tenant
    - External
  ComputeOvsHwOffload:
    - InternalApi
    - Storage
    - Tenant
    - External
  CephStorage:
    - Storage
    - StorageMgmt
  ComputeHCI:
    - InternalApi
    - Storage
    - StorageMgmt
    - Tenant
    - External
  ComputeInstanceHA:
    - InternalApi
