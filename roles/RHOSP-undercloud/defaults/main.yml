---
# defaults file for RHOSP-undercloud

# RHOSP version
RHOSP_version: 17.1
RHOSP_release: latest

# Custom RHEL image: set URL to use a custom image. If it's a local file, use "file://<full_path>"
CustomRhelImage: "{{ RHOSP_version_supported[RHOSP_version].rhel_image.url }}"

# Cleaning and creating parameters
create: True

# overcloud parameters
overcloud_ip: 10.0.0.254
vncproxy: ''

# dns and ntp servers
dns_servers:
  - '8.8.8.8'
  - '8.8.4.4'
ntp_servers: 
  - '0.pool.ntp.org'
  - '1.pool.ntp.org'
  - '2.pool.ntp.org'
  - '3.pool.ntp.org'

# Default leaf configuration
DefaultLeaf0:
  name: overcloud
  hypervisor: localhost
  subnet:
    name: ctlplane-subnet
    cidr: 192.168.24.0/24
    dhcp_start: 192.168.24.5
    dhcp_end: 192.168.24.55
    inspection_iprange: 192.168.24.100,192.168.24.120
    gateway: 192.168.24.254
    masquerade: false
  networks:
    Tenant:
      prefix: '172.16.0'
      vlan: 10
      network: RHOSPVirtLab_ctlplane
    Storage:
      prefix: '172.16.1'
      vlan: 20
      network: RHOSPVirtLab_ctlplane
    InternalApi:
      prefix: '172.16.2'
      vlan: 30
      network: RHOSPVirtLab_ctlplane
    StorageMgmt:
      prefix: '172.16.3'
      vlan: 40
      network: RHOSPVirtLab_ctlplane
    External:
      prefix: '10.0.0'
      network: RHOSPVirtLab_external
    Management:
      prefix: '10.0.1'
      vlan: 60
      network: RHOSPVirtLab_ctlplane

# interfaces to use in each nic-config
interfaces:
  Controller:
    ControlPlane: nic1
    External: nic2
  Compute:
    ControlPlane: nic1
    External: nic2
  ComputeOvsDpdk:
    ControlPlane: nic1
    External: nic2
    DpdkBonds:
      - name: dpdkbond0
        ports:
          - name: dpdk0
            interface: nic3
            driver: vfio-pci
          - name: dpdk1
            interface: nic4
            driver: vfio-pci
  ComputeOvsDpdkSriov:
    ControlPlane: nic1
    External: nic2v0
    Sriov:
      - device: nic2
        numvfs: 8
    DpdkBonds:
      - name: dpdkbond0
        ports:
          - name: dpdk0
            interface: nic2v1
            driver: vfio-pci
          - name: dpdk1
            interface: nic2v2
            driver: vfio-pci
  ComputeSriov:
    ControlPlane: nic1
    External: nic2v0
    Sriov:
      - device: nic2
        numvfs: 8
  ComputeOvsHwOffload:
    ControlPlane: nic1
    External: nic2v0
    Sriov:
      - device: nic2
        numvfs: 8
  CephStorage:
    ControlPlane: nic1
    External: nic2
  ComputeHCI:
    ControlPlane: nic1
    External: nic2
  ComputeInstanceHA:
    ControlPlane: nic1
    External: nic2
  DistributedCompute:
    ControlPlane: nic1
    External: nic2
  DistributedComputeScaleOut:
    ControlPlane: nic1
    External: nic2
  DistributedComputeHCI:
    ControlPlane: nic1
    External: nic2
  DistributedComputeHCIScaleOut:
    ControlPlane: nic1
    External: nic2
  CephAll:
    ControlPlane: nic1
    External: nic2

# All computes default properties
BridgeMappings: 'datacentre:br-ex'
NetworkVlanRanges: 'datacentre:1:1000'

# ComputeSriov default properties
ComputeSriovProperties:
  isolcpus: '8-19'
  hugepagesz: '1GB'
  hugepages: 32
  kernelargs: 'iommu=pt intel_iommu=on'
  physicaldevmappings: 'datacentre:br-ex,sriov1:ens1f1'
  dedicatedcpus: '8-19'
  sharedcpus: '4-7'
  hostmemory: 8192
  pcipassthrough:
    - devname: ens1f1
      physical_network: 'sriov1'
      trusted: true

# ComputeOvsHwOffload default properties
ComputeOvsHwOffloadProperties:
  isolcpus: '8-19'
  hugepagesz: '1GB'
  hugepages: 32
  kernelargs: 'iommu=pt intel_iommu=on'
  physicaldevmappings: 'datacentre:br-ex,offload1:ens1f1'
  dedicatedcpus: '8-19'
  sharedcpus: '4-7'
  hostmemory: 8192
  pcipassthrough:
    - devname: ens1f1
      physical_network: 'offload1'
      trusted: true

# ComputeOvsDpdk default properties
ComputeOvsDpdkProperties:
  isolcpus: '6-23,30-47'
  hugepagesz: '1GB'
  hugepages: 32
  kernelargs: 'iommu=pt intel_iommu=on'
  dedicatedcpus: '8-23,32-47'
  sharedcpus: '6-7,30-31'
  hostmemory: 8192
  socketmemory: '4096,4096'
  memorychannels: '4'
  ovsdpdkcorelist: '2,26,3,27'
  ovspmdcorelist: '4,28,5,29'

# ComputeOvsDpdkSriov default properties
ComputeOvsDpdkSriovProperties:
  isolcpus: '6-23,30-47'
  hugepagesz: '1GB'
  hugepages: 32
  kernelargs: 'iommu=pt intel_iommu=on'
  dedicatedcpus: '8-23,32-47'
  sharedcpus: '6-7,30-31'
  hostmemory: 8192
  socketmemory: '4096,4096'
  memorychannels: '4'
  ovsdpdkcorelist: '2,26,3,27'
  ovspmdcorelist: '4,28,5,29'
  physicaldevmappings: 'datacentre:br-ex,sriov1:ens1f1'
  pcipassthrough:
    - devname: ens1f1
      physical_network: 'sriov1'
      trusted: true

# CephStorage default properties
CephStorageProperties:
  devices: ['/dev/sdb']

# Run a full `yum update` of the undercloud host on every run (reboots if
# needed). Set to False to skip the upgrade for faster, more predictable runs.
UndercloudFullUpdate: True

# Octavia parameters
DeployOctavia: False

# Designate parameters
DeployDesignate: False

# FRR parameters
DeployFrr: False

# Subscription manager parameters
RegisterNodes: False

# Low Memory Usage parameters
LowMemUsage: True

# Enable fencing for controllers
ControllersFencing: True

# Neutron driver
NeutronDriver: ovn

# DCN leafs
DCNLeafs: []

# Snmpd configuration
SnmpdReadonlyUserPassword: RHOSPVirtLab

# Credentials (lab-only weak defaults; override via vault_credentials.yaml).
# BMC / IPMI credentials consumed via pm.user / pm.password in vars/machines.yml
# (instackenv and fencing configuration).
BmcUsername: admin
BmcPassword: admin
# Overcloud admin account created by the undercloud.
OvercloudAdminPassword: redhat
OvercloudAdminEmail: admin@example.com
# Password for the test admin user created in overcloud_resources.yaml.
TestUserPassword: redhat

# Disable telemetry
DisableTelemetry: True

# Telemetry parameters (Set DisableTelemetry to False to use)
Telemetry: False
#  MetricsConnectorHost: default-interconnect-5671-service-telemetry.apps.ocp-sno-for-stf.redhat.local
#  MetricsConnectorIPAddress: 10.8.223.249
#  Cloud: cloud1
#  Certificate: |
#    -----BEGIN CERTIFICATE-----
#    <snip>
#    -----END CERTIFICATE-----

# Parameter to define extra firewall rules for the undercloud
UndercloudExtraFirewallRules: []
#    '300 checkmk':
#      port: 8081
#      proto: tcp
#      action: accept
#    '301 checkmk':
#      port: 15000
#      proto: tcp
#      action: accept
#    '302 checkmk':
#      port: 6556
#      proto: tcp
#      action: accept
#    '303 checkmk':
#      port: 6557
#      proto: tcp
#      action: accept
#    '304 checkmk':
#      port: 8000
#      proto: tcp
#      action: accept

# Default flavors size
DefaultFlavorsSize:
  - name: nano
    vcpus: 1
    ram: 128
    disk: 2
    ephemeral: 0
    swap: 0
  - name: micro
    vcpus: 1
    ram: 256
    disk: 5
    ephemeral: 0
    swap: 0
  - name: small
    vcpus: 1
    ram: 512
    disk: 10
    ephemeral: 0
    swap: 0
  - name: medium
    vcpus: 2
    ram: 1024
    disk: 10
    ephemeral: 0
    swap: 0
  - name: large
    vcpus: 2
    ram: 2048
    disk: 20
    ephemeral:
    swap: 0
  - name: xlarge
    vcpus: 4
    ram: 4096
    disk: 20
    ephemeral: 0
    swap: 0
  - name: 2xlarge
    vcpus: 8
    ram: 8192
    disk: 50
    ephemeral: 0
    swap: 0

# undercloud is the director host, defined separately from the overcloud `machines`.
# By default it is a libvirt VM created by the virt-infra role. Only the non-constant
# fields are set here; the role injects the constants that never change for the
# undercloud (name=undercloud, pre_provisioned=true, openstack.role=undercloud). See
# vars/machines.yml for the full schema, including how to make it a physical host.
undercloud:
  type: libvirt
  libvirt:
    title: 'RHOSPVirtLab Undercloud'
    hypervisor: localhost
    cpus: 2
    memory: 6291456
    disks:
      - root: true
        size: 107374182400
    network:
      interfaces:
        - name: nic1
          mac: '0c:1f:0d:10:00:00'
          bridge: br-ctlplane
        - name: nic2
          mac: '0c:1f:0d:10:00:02'
          bridge: br-management
          management: true

# machines is the list of overcloud nodes (virtual and physical) to be created/managed.
# The role defines one controller node and one compute node by default and no physical
# machines. See vars/machines.yml for the full schema.
machines:
  - name: controller0
    type: libvirt
    openstack:
      role: controller
    pm:
      type: ipmi
      user: admin
      password: admin
      address: localhost
      port: 6231
      mode: bios
    libvirt:
      title: 'RHOSPVirtLab Virtual Controller 0'
      hypervisor: localhost
      cpus: 2
      memory: 8388608
      disks:
        - root: true
          size: 53687091200
      network:
        interfaces:
          - name: nic1
            mac: '0c:1f:0d:11:00:00'
            bridge: br-ctlplane
  - name: compute0
    type: libvirt
    openstack:
      role: compute
    pm:
      type: ipmi
      user: admin
      password: admin
      address: localhost
      port: 6234
      mode: bios
    libvirt:
      title: 'RHOSPVirtLab Virtual Compute 0'
      hypervisor: localhost
      cpus: 4
      memory: 6291456
      disks:
        - root: true
          size: 53687091200
      network:
        interfaces:
          - name: nic1
            mac: '0c:1f:0d:12:00:00'
            bridge: br-ctlplane

# networks is a list to define the virtual networks to be created
networks:
  - name: RHOSPVirtLab_ctlplane
    hypervisor: localhost
    bridge: br-ctlplane
    forward: bridge
    mac_suffix: '00'
    ipv4:
      address: '192.168.24.254'
      netmask: '255.255.255.0'
      dhcp: false
  - name: RHOSPVirtLab_management
    hypervisor: localhost
    bridge: br-management
    forward: nat
    mac_suffix: '02'
    ipv4:
      address: '192.168.250.1'
      netmask: '255.255.255.0'
      dhcp:
        start: '192.168.250.100'
        end: '192.168.250.254'
        hosts: true
