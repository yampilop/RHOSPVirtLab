---
# defaults file for RHOSP-virt-infra

# RHOSP version
RHOSP_version: 17.1
RHOSP_release: latest

# Custom RHEL image: set URL to use a custom image. If it's a local file, use "file://<full_path>"
CustomRhelImage: "{{ RHOSP_version_supported[RHOSP_version].rhel_image.url }}"

# Cleaning and creating parameters
cleanup: False
create: True

# overcloud parameters
external_if: eno1
overcloud_ip: 10.0.0.254
forward_network: RHOSPVirtLab_external
forwarded_ports:
  - 80
  - 6080
  - 5000

# Default leaf configuration
DefaultLeaf0:
  name: overcloud
  hypervisor: localhost
  subnet:
    name: ctlplane-subnet
    cidr: 192.168.24.0/24
    dhcp_start: 192.168.24.5
    dhcp_end: 192.168.24.55
    inspection_iprange: 192.168.24.100,192.168.24.120
    gateway: 192.168.24.254
    masquerade: false
  networks:
    Tenant:
      prefix: '172.16.0'
      vlan: 10
      network: RHOSPVirtLab_ctlplane
    Storage:
      prefix: '172.16.1'
      vlan: 20
      network: RHOSPVirtLab_ctlplane
    InternalApi:
      prefix: '172.16.2'
      vlan: 30
      network: RHOSPVirtLab_ctlplane
    StorageMgmt:
      prefix: '172.16.3'
      vlan: 40
      network: RHOSPVirtLab_ctlplane
    External:
      prefix: '10.0.0'
      network: RHOSPVirtLab_external
    Management:
      prefix: '10.0.1'
      vlan: 60
      network: RHOSPVirtLab_ctlplane

# DCN leafs
DCNLeafs: []

# undercloud is the director host, defined separately from the overcloud `machines`.
# By default it is a libvirt VM created by this role. Only the non-constant fields are
# set here; the role injects the constants that never change for the undercloud
# (name=undercloud, pre_provisioned=true, openstack.role=undercloud) and creates no
# virtualbmc for it (it is not power-managed). See vars/machines.yml for the full
# schema, including how to make it a pre-existing physical host.
undercloud:
  type: libvirt
  libvirt:
    title: 'RHOSPVirtLab Undercloud'
    hypervisor: localhost
    cpus: 2
    memory: 6291456
    disks:
      - root: true
        size: 107374182400
    network:
      interfaces:
        - name: nic1
          mac: '0c:1f:0d:10:00:00'
          bridge: br-ctlplane
        - name: nic2
          mac: '0c:1f:0d:10:00:02'
          bridge: br-management
          management: true

# machines is the list of overcloud nodes (virtual and physical) to be created/managed.
# The role defines one controller node and one compute node by default and no physical
# machines. See vars/machines.yml for the full schema documentation.
machines:
  - name: controller0
    type: libvirt
    openstack:
      role: controller
    pm:
      type: ipmi
      user: admin
      password: admin
      address: localhost
      port: 6231
      mode: bios
    libvirt:
      title: 'RHOSPVirtLab Virtual Controller 0'
      hypervisor: localhost
      cpus: 2
      memory: 8388608
      disks:
        - root: true
          size: 53687091200
      network:
        interfaces:
          - name: nic1
            mac: '0c:1f:0d:11:00:00'
            bridge: br-ctlplane
  - name: compute0
    type: libvirt
    openstack:
      role: compute
    pm:
      type: ipmi
      user: admin
      password: admin
      address: localhost
      port: 6234
      mode: bios
    libvirt:
      title: 'RHOSPVirtLab Virtual Compute 0'
      hypervisor: localhost
      cpus: 4
      memory: 6291456
      disks:
        - root: true
          size: 53687091200
      network:
        interfaces:
          - name: nic1
            mac: '0c:1f:0d:12:00:00'
            bridge: br-ctlplane

# networks is a list to define the virtual networks to be created
networks:
  - name: RHOSPVirtLab_ctlplane
    hypervisor: localhost
    bridge: br-ctlplane
    forward: bridge
    mac_suffix: '00'
    ipv4:
      address: '192.168.24.254'
      netmask: '255.255.255.0'
      dhcp: false
  - name: RHOSPVirtLab_management
    hypervisor: localhost
    bridge: br-management
    forward: nat
    mac_suffix: '02'
    ipv4:
      address: '192.168.250.1'
      netmask: '255.255.255.0'
      dhcp:
        start: '192.168.250.100'
        end: '192.168.250.254'
        hosts: true