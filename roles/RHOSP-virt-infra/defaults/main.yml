---
# defaults file for RHOSP-virt-infra

# RHOSP version
RHOSP_version: 17.1
RHOSP_release: latest

# Custom RHEL image: set URL to use a custom image. If it's a local file, use "file://<full_path>"
CustomRhelImage: "{{ RHOSP_version_supported[RHOSP_version].rhel_image.url }}"

# Cleaning and creating parameters
cleanup: False
create: True

# overcloud parameters
external_if: eno1
forward_network: RHOSPVirtLab_external
forwarded_ports:
  - 80
  - 6080
  - 5000

# Leaf configuration (control-plane leaf `overcloud` + optional DCN leafs). See README.
leafs:
- name: overcloud
  hypervisor: localhost
  additional_bridges:
  - name: br-external
    interface: null # Optional when external connection is needed
    ipv4:
      address: 10.0.0.254
  ctlplane_bridge:
    name: br-ctlplane
    interface: null # Optional when external connection is needed
  ctlplane_subnet:
    name: ctlplane-subnet
    cidr: 192.168.24.0/24
    dhcp_start: 192.168.24.5
    dhcp_end: 192.168.24.99
    inspection_iprange: 192.168.24.100,192.168.24.120
    gateway: 192.168.24.254
    masquerade: false
  networks:
  - name: Tenant
    bridge: br-ctlplane
    vip: false
    mtu: 1500
    subnet:
      ip_subnet: 172.16.0.0/24
      allocation_pools:
      - start: 172.16.0.5
        end: 172.16.0.99
      vlan: 10
  - name: Storage
    bridge: br-ctlplane
    vip: true
    mtu: 1500
    subnet:
      ip_subnet: 172.16.1.0/24
      allocation_pools:
      - start: 172.16.1.5
        end: 172.16.1.99
      vlan: 11
  - name: InternalApi
    bridge: br-ctlplane
    vip: true
    mtu: 1500
    subnet:
      ip_subnet: 172.16.2.0/24
      allocation_pools:
      - start: 172.16.2.5
        end: 172.16.2.99
      vlan: 12
  - name: StorageMgmt
    bridge: br-ctlplane
    vip: true
    mtu: 1500
    subnet:
      ip_subnet: 172.16.3.0/24
      allocation_pools:
      - start: 172.16.3.5
        end: 172.16.3.99
      vlan: 13
  - name: External
    bridge: br-external
    vip: true
    mtu: 1500
    subnet:
      ip_subnet: 10.0.0.0/24
      allocation_pools:
      - start: 10.0.0.5
        end: 10.0.0.99
      gateway: 10.0.0.254

# The director host, defined separately from the overcloud `machines` (libvirt VM by
# default; the role injects its constants and creates no vbmc for it). See README.
undercloud:
  type: libvirt
  libvirt:
    title: 'RHOSPVirtLab Undercloud'
    hypervisor: localhost
    cpus: 2
    memory: 6291456
    disks:
      - root: true
        size: 107374182400
    network:
      interfaces:
        # Only the control-plane NIC; the role injects the mgmt NIC (see README).
        - name: nic1
          mac: '0c:1f:0d:10:00:00'
          bridge: br-ctlplane

# The overcloud nodes (virtual and physical); default: one controller + one compute.
# See README for the full schema.
machines:
  - name: controller0
    type: libvirt
    openstack:
      role: controller
    pm:
      type: ipmi
      user: admin
      password: admin
      address: localhost
      port: 6231
      mode: bios
    libvirt:
      title: 'RHOSPVirtLab Virtual Controller 0'
      hypervisor: localhost
      cpus: 2
      memory: 8388608
      disks:
        - root: true
          size: 53687091200
      network:
        interfaces:
          - name: nic1
            mac: '0c:1f:0d:11:00:00'
            bridge: br-ctlplane
  - name: compute0
    type: libvirt
    openstack:
      role: compute
    pm:
      type: ipmi
      user: admin
      password: admin
      address: localhost
      port: 6234
      mode: bios
    libvirt:
      title: 'RHOSPVirtLab Virtual Compute 0'
      hypervisor: localhost
      cpus: 4
      memory: 6291456
      disks:
        - root: true
          size: 53687091200
      network:
        interfaces:
          - name: nic1
            mac: '0c:1f:0d:12:00:00'
            bridge: br-ctlplane

# Credentials (lab-only weak defaults; override via vault_credentials.yaml — see README).
# BMC / IPMI credentials used to create the virtualbmc endpoints.
BmcUsername: admin
BmcPassword: admin
# Passwords baked into each VM's cloud-init (root and the ci_user account).
VmRootPassword: redhat
VmStackPassword: redhat