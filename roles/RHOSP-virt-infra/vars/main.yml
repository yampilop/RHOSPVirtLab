---
# vars file for RHOSP-virt-infra

# Whether the undercloud is a pre-existing physical host (admin-prepared) rather
# than a libvirt VM this role creates. The undercloud is defined on its own in the
# top-level `undercloud` variable, separate from the `machines` list.
undercloud_is_physical: "{{ (undercloud.type | default('libvirt')) == 'physical' }}"

# The `undercloud` input dict is kept minimal to avoid human error. The fields the
# build tasks require but that are CONSTANT for the undercloud are injected here so
# they can never be set wrong: it is always named `undercloud`, always
# pre_provisioned, and always openstack.role=undercloud. No `pm` is injected - the
# undercloud is the director, is not power-managed by the lab, and gets no virtualbmc
# (tasks that need power management skip machines without a `pm` block).
undercloud_base: "{{ {'name': 'undercloud', 'pre_provisioned': true, 'openstack': {'role': 'undercloud'}} | combine(undercloud, recursive=true) }}"

# For a libvirt undercloud the management/Ansible-access NIC is NOT user-editable: its
# MAC must match the static DHCP lease pinned by the management network (see
# libvirt_management_network / undercloud_management_interface below), so the role
# appends the fixed management interface to whatever control-plane NIC(s) the user
# defined in the `undercloud` dict. A physical undercloud has no libvirt block and gets
# nothing injected.
undercloud_effective: >-
  {{ (undercloud_base | combine({'libvirt': {'network': {'interfaces':
        ((undercloud.libvirt.network.interfaces | default([])) + [undercloud_management_interface])
     }}}, recursive=true))
     if not (undercloud_is_physical | bool) else undercloud_base }}

# Convenience views over the machines list. `machines` now holds only the overcloud
# nodes; the undercloud lives in `undercloud`. This role BUILDS the undercloud when
# it is a libvirt VM, so its libvirt view includes it (in its injected form); a
# physical (admin-prepared) undercloud is never created here and never appears.
libvirt_machines: "{{ (machines | selectattr('type', 'equalto', 'libvirt') | list) + ([undercloud_effective] if not (undercloud_is_physical | bool) else []) }}"
physical_machines: "{{ machines | selectattr('type', 'equalto', 'physical') | list }}"

# Whether any libvirt resources are needed at all: true when there is at least one VM
# to build (a libvirt undercloud and/or libvirt overcloud nodes in `machines`). When
# false - a physical undercloud AND no libvirt machines - the role installs and creates
# no libvirt resources and skips the nested-virtualization checks; only the host-level
# plumbing (network bridges, firewall, SSH access to the undercloud) runs.
libvirt_required: "{{ libvirt_machines | length > 0 }}"

# Whether VirtualBMC is needed. It emulates a BMC so ironic can power-cycle a VM, so it
# only matters for libvirt overcloud nodes (the libvirt entries of `machines`). The
# undercloud is the director, is not power-managed by the lab and never gets a vbmc, so
# it is deliberately excluded here: a lab with a libvirt undercloud but no libvirt
# overcloud VMs installs and configures no VirtualBMC at all.
vbmc_required: "{{ (machines | selectattr('type', 'equalto', 'libvirt') | list | length) > 0 }}"

# Whether the hypervisor must build the lab's L2 bridges (and their VLAN gateways /
# firewall zoning). This is broader than libvirt: the bridges host libvirt VMs, but
# physical nodes also join the lab by trunking a real NIC into the ctlplane/external
# bridges via a network's `hypervisor_if`. So bridges are needed when there is at least
# one VM to attach OR at least one network declares a physical uplink. When false - a
# fully physical lab whose nodes sit on external switches with no uplink trunked here,
# or a lab with nothing on the hypervisor networks at all - the bridge/VLAN profiles and
# their firewall zoning are skipped. The uplink ethernet/port tasks are self-gated on
# `hypervisor_if is defined` and need no extra guard.
bridges_required: "{{ (libvirt_required | bool) or ((libvirt_networks | default([]) | selectattr('hypervisor_if', 'defined') | list | length) > 0) }}"

# Whether the management (NAT) network must be created on localhost. It provides the
# Ansible/management access NIC, so it is only needed when something on localhost has a
# management interface: a libvirt undercloud (created by this role), or a pre-provisioned
# libvirt overcloud VM on localhost (a deployed server the undercloud must reach).
management_network_required: >-
  {{ (not (undercloud_is_physical | bool))
     or ((machines | selectattr('type', 'equalto', 'libvirt')
                   | selectattr('libvirt.hypervisor', 'equalto', 'localhost')
                   | selectattr('pre_provisioned', 'defined')
                   | selectattr('pre_provisioned') | list | length) > 0) }}

# Derived views over the `leafs` list (replaces the old DefaultLeaf0 / DCNLeafs
# split). The default (control-plane) leaf is always named `overcloud`; the rest
# are the DCN leafs. Derived by name - not list position - so authoring order in
# vars/options.yml does not affect correctness.
default_leaf: "{{ leafs | selectattr('name', 'equalto', 'overcloud') | first }}"
dcn_leafs: "{{ leafs | rejectattr('name', 'equalto', 'overcloud') | list }}"

pool_location: '/var/lib/libvirt/images/RHOSPVirtLab_storage'

# VirtualBMC install location. On RHEL 9/10 the system interpreter is
# externally managed (PEP 668), so VirtualBMC is installed into a dedicated
# venv and the binaries live there; on 7.9/8.4 it goes to /usr/local/bin.
vbmc_venv: "/opt/vbmc"
vbmc_bindir: "{{ (vbmc_venv ~ '/bin') if (ansible_distribution_major_version | int >= 9) else '/usr/local/bin' }}"
vbmc_path: "{{ vbmc_bindir }}/vbmc"
vbmcd_path: "{{ vbmc_bindir }}/vbmcd"

# libvirt service/socket units to enable, by host major version:
#   7  -> monolithic libvirtd.service
#   8/9 -> libvirtd.socket (socket activation, monolithic daemon)
#   10 -> monolithic libvirtd removed; modular daemon sockets
libvirt_units: >-
  {{ ['libvirtd.service'] if (ansible_distribution_major_version | int <= 7)
     else (['virtqemud.socket', 'virtnetworkd.socket', 'virtstoraged.socket', 'virtnodedevd.socket']
           if (ansible_distribution_major_version | int >= 10)
           else ['libvirtd.socket']) }}

RHEL_version_supported:
  "7.9":
    packages:
      - libvirt
      - libvirt-bash-completion
      - libguestfs-tools
      - ipmitool
      - python3-pip
      - python3-devel
      - libvirt-devel
      - libvirt-python
      - python-lxml
      - gcc
      - python2-jinja2
      - OVMF
      - dhcp
    pip:
      - virtualbmc
      - argcomplete
    ovmf_path: '/usr/share/OVMF/'
  "8.4":
    packages:
      - libvirt
      - libvirt-bash-completion
      - libguestfs-tools
      - ipmitool
      - "@python36"
      - python3-lxml
      - python3-libvirt
      - edk2-ovmf
      - dhcp-relay
    pip:
      - virtualbmc
    ovmf_path: '/usr/share/edk2/ovmf/'
  "9.6":
    packages:
      - libvirt
      - guestfs-tools
      - ipmitool
      - python3-lxml
      - python3-libvirt
      - edk2-ovmf
      - dhcp-relay
    pip:
      - virtualbmc
    ovmf_path: '/usr/share/edk2/ovmf/'
  "10.2":
    packages:
      - libvirt
      - guestfs-tools
      - ipmitool
      - python3-lxml
      - python3-libvirt
      - edk2-ovmf
      # ISC dhcp/dhcrelay were removed in RHEL 10; dnsmasq provides the
      # DHCP relay (see dhcrelay.service.j2).
      - dnsmasq
    pip:
      - virtualbmc
    ovmf_path: '/usr/share/edk2/ovmf/'

RHOSP_version_supported:
  17.1:
    rhel_image:
      url: 'http://porkchop.redhat.com/released/RHEL-9/9.2.0/BaseOS/x86_64/images/rhel-guest-image-9.2-20230414.17.x86_64.qcow2'
      name: 'rhel-9.2-x86_64-kvm.qcow2'
      main_partition: '/dev/sda4'
    rhel_release: '9.2'
    overcloud_ssh_user: tripleo-admin
  16.2:
    rhel_image:
      url: 'http://porkchop.redhat.com/released/RHEL-8/8.4.0/BaseOS/x86_64/images/rhel-guest-image-8.4-992.x86_64.qcow2'
      name: 'rhel-8.4-x86_64-kvm.qcow2'
      main_partition: '/dev/sda3'
    rhel_release: '8.4'
    overcloud_ssh_user: heat-admin

# Logical name of the management/Ansible-access interface. A machine exposes a
# management NIC by including an interface with this name; this replaces the old
# per-interface `management: true` flag. The name (not nicN) never collides with
# user-added NICs and maps to the real device in the os-net-config file later.
management_interface_name: mgmt

# Fixed management-access wiring for a libvirt undercloud. The MAC must be known ahead
# of time so the management network can pin a static DHCP lease to it (see
# libvirt_management_network.ipv4.dhcp.hosts), so the interface is a role constant that
# is injected into undercloud_effective rather than being editable in vars/machines.yml.
undercloud_management_mac: '0c:1f:0d:10:00:02'
undercloud_management_ip: '192.168.250.10'
undercloud_management_interface:
  name: "{{ management_interface_name }}"
  mac: "{{ undercloud_management_mac }}"
  bridge: "{{ libvirt_management_network.bridge }}"

# The management (NAT) libvirt network. Moved here from vars/networks.yml: it is not
# part of the per-leaf network model and is created on localhost only, gated by
# management_network_required. Its DHCP hands the undercloud a static lease at
# undercloud_management_ip (VM undercloud only; a physical undercloud brings its own
# address so no lease is reserved).
libvirt_management_network:
  name: RHOSPVirtLab_management
  hypervisor: localhost
  bridge: br-management
  forward: nat
  ipv4:
    address: '192.168.250.1'
    netmask: '255.255.255.0'
    dhcp:
      start: '192.168.250.100'
      end: '192.168.250.254'
      hosts: "{{ [{'mac': undercloud_management_mac, 'ip': undercloud_management_ip, 'name': 'undercloud'}] if not (undercloud_is_physical | bool) else [] }}"