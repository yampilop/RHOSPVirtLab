---
# vars file for RHOSP-virt-infra

# Convenience views over the unified machines list
libvirt_machines: "{{ machines | selectattr('type', 'equalto', 'libvirt') | list }}"
physical_machines: "{{ machines | selectattr('type', 'equalto', 'physical') | list }}"

pool_location: '/var/lib/libvirt/images/RHOSPVirtLab_storage'
vbmc_path: "/usr/local/bin/vbmc"
vbmcd_path: "/usr/local/bin/vbmcd"

RHEL_version_supported:
  "7.9":
    packages:
      - libvirt
      - libvirt-bash-completion
      - libguestfs-tools
      - ipmitool
      - python3-pip
      - python3-devel
      - libvirt-devel
      - libvirt-python
      - python-lxml
      - gcc
      - python2-jinja2
      - OVMF
      - dhcp
    pip:
      - virtualbmc
      - netaddr
      - argcomplete
    ovmf_path: '/usr/share/OVMF/'
  "8.4":
    packages:
      - libvirt
      - libvirt-bash-completion
      - libguestfs-tools
      - ipmitool
      - "@python36"
      - python3-lxml
      - python3-libvirt
      - edk2-ovmf
      - dhcp-relay
    pip:
      - virtualbmc
      - netaddr
    ovmf_path: '/usr/share/edk2/ovmf/'
  "9.6":
    packages:
      - libvirt
      - libguestfs-tools
      - ipmitool
      - python3-lxml
      - python3-libvirt
      - edk2-ovmf
      - dhcp-relay
    pip:
      - virtualbmc
      - netaddr
    ovmf_path: '/usr/share/edk2/ovmf/'
  "10.2":
    packages:
      - libvirt
      - libguestfs-tools
      - ipmitool
      - python3-lxml
      - python3-libvirt
      - edk2-ovmf
      - dhcp-relay
    pip:
      - virtualbmc
      - netaddr
    ovmf_path: '/usr/share/edk2/ovmf/'

RHOSP_version_supported:
  17.1:
    rhel_image:
      url: 'http://porkchop.redhat.com/released/RHEL-9/9.2.0/BaseOS/x86_64/images/rhel-guest-image-9.2-20230414.17.x86_64.qcow2'
      name: 'rhel-9.2-x86_64-kvm.qcow2'
      main_partition: '/dev/sda4'
    rhel_release: '9.2'
    overcloud_ssh_user: tripleo-admin
  16.2:
    rhel_image:
      url: 'http://porkchop.redhat.com/released/RHEL-8/8.4.0/BaseOS/x86_64/images/rhel-guest-image-8.4-992.x86_64.qcow2'
      name: 'rhel-8.4-x86_64-kvm.qcow2'
      main_partition: '/dev/sda3'
    rhel_release: '8.4'
    overcloud_ssh_user: heat-admin