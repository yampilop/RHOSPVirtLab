- name: DHCRELAY - Determine which leaf this hypervisor belongs to
  set_fact:
    hypervisor_leaf: "{{ leafs | selectattr('hypervisor', 'search', inventory_hostname) | first }}"

- name: DHCRELAY - Create dhcrelay systemd unit
  template:
    src: "dhcrelay.service.j2"
    dest: "/etc/systemd/system/dhcrelay.service"
    owner: root
    group: root
    mode: "0644"
  become: yes

- name: DHCRELAY - Reload systemd daemon
  systemd:
    daemon_reload: yes
  become: yes

- name: DHCRELAY - Enable and start dhcrelay service
  service:
    name: dhcrelay
    state: started
    enabled: yes
  become: yes
