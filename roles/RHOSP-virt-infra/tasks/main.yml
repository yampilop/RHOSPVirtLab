---
# tasks file for RHOSP-virt-infra

- name: CHECKS - Perform some checks
  import_tasks: tasks/checks.yml

- name: SETUP - Make the hypervisor setup
  import_tasks: tasks/setup.yml

- name: SETUP - Register computed variables as facts for template access
  set_fact:
    undercloud_is_physical: "{{ (undercloud.type | default('libvirt')) == 'physical' }}"
    undercloud_effective: >-
      {{ (undercloud_base | combine({'libvirt': {'network': {'interfaces':
            ((undercloud.libvirt.network.interfaces | default([])) + [undercloud_management_interface])
         }}}, recursive=true))
         if not (undercloud_is_physical | bool) else undercloud_base }}
    libvirt_machines: "{{ (machines | selectattr('type', 'equalto', 'libvirt') | list) + ([undercloud_effective] if not (undercloud_is_physical | bool) else []) }}"
    physical_machines: "{{ machines | selectattr('type', 'equalto', 'physical') | list }}"
    libvirt_required: "{{ libvirt_machines | length > 0 }}"
    vbmc_required: "{{ (machines | selectattr('type', 'equalto', 'libvirt') | list | length) > 0 }}"
    bridges_required: "{{ (libvirt_required | bool) or ((libvirt_networks | default([]) | selectattr('hypervisor_if', 'defined') | list | length) > 0) }}"
    management_network_required: >-
      {{ (not (undercloud_is_physical | bool))
         or ((machines | selectattr('type', 'equalto', 'libvirt')
                       | selectattr('libvirt.hypervisor', 'equalto', 'localhost')
                       | selectattr('pre_provisioned', 'defined')
                       | selectattr('pre_provisioned') | list | length) > 0) }}
    default_leaf: "{{ leafs | selectattr('name', 'equalto', 'overcloud') | first }}"
    dcn_leafs: "{{ leafs | rejectattr('name', 'equalto', 'overcloud') | list }}"
  vars:
    undercloud_base: "{{ {'name': 'undercloud', 'pre_provisioned': true, 'openstack': {'role': 'undercloud'}} | combine(undercloud, recursive=true) }}"

# Assemble the libvirt networks/bridges to manage from the `leafs` model plus the
# management (NAT) network (prepended when required). See README (Networks) for details.
- name: NETWORKING - Assemble the list of libvirt networks to manage
  set_fact:
    libvirt_networks: "{{ management_part + (leaf_bridges | from_yaml) }}"
  vars:
    management_part: "{{ [libvirt_management_network] if (management_network_required | bool) else [] }}"
    leaf_bridges: |-
      [
      {% for leaf in leafs %}
      {{ ({
           'name': 'RHOSPVirtLab_' ~ (leaf.ctlplane_bridge.name | regex_replace('^br-', '')),
           'hypervisor': leaf.hypervisor,
           'bridge': leaf.ctlplane_bridge.name,
           'forward': 'bridge',
           'ipv4': {'address': leaf.ctlplane_subnet.gateway,
                    'netmask': leaf.ctlplane_subnet.cidr | ipaddr('netmask')}
         } | combine({'hypervisor_if': leaf.ctlplane_bridge.interface}
                     if leaf.ctlplane_bridge.interface else {})) | to_json }},
      {% for ab in leaf.additional_bridges | default([]) %}
      {% set on_bridge = leaf.networks | default([]) | selectattr('bridge', 'equalto', ab.name) | list %}
      {% set native = on_bridge | rejectattr('subnet.vlan', 'defined') | list %}
      {% set base = (native | first) if native else ((on_bridge | first) if on_bridge else none) %}
      {{ ({
           'name': 'RHOSPVirtLab_' ~ (ab.name | regex_replace('^br-', '')),
           'hypervisor': leaf.hypervisor,
           'bridge': ab.name,
           'forward': 'bridge'
         } | combine({'hypervisor_if': ab.interface} if ab.interface else {})
           | combine({'ipv4': {'address': ab.ipv4.address,
                               'netmask': (base.subnet.ip_subnet if base else '0.0.0.0/24') | ipaddr('netmask')}}
                     if ab.ipv4 is defined else {})) | to_json }},
      {% endfor %}
      {% endfor %}
      ]

# The overcloud public IP (firewall port-forwards, `overcloud` /etc/hosts alias,
# network-hook DNAT): the default leaf's External VIP, else its ctlplane VIP.
- name: NETWORKING - Derive the overcloud public IP
  set_fact:
    overcloud_ip: >-
      {{ (default_leaf.networks | default([]) | selectattr('name', 'equalto', 'External') | list | first).subnet.vip
         if (default_leaf.networks | default([]) | selectattr('name', 'equalto', 'External') | list | length > 0)
         else default_leaf.ctlplane_subnet.vip }}

# Cleanup process

- name: DHCRELAY - Clean DHCP relay
  import_tasks: clean_dhcrelay.yml
  when:
    - cleanup | bool
    - dcn_leafs | length > 0

- name: FIREWALL - Clean firewall
  import_tasks: clean_firewall.yml
  when: cleanup | bool

- name: VIRTUALBMC - Clean VirtualBMC
  import_tasks: clean_virtualbmc.yml
  when:
    - cleanup | bool
    - vbmc_required | bool

- name: LIBVIRT - Clean libvirt domains
  import_tasks: clean_libvirt_domains.yml
  when:
    - cleanup | bool
    - libvirt_required | bool

- name: STORAGE - Clean cloud-init files and ISOs
  import_tasks: clean_libvirt_cloud_init.yml
  when:
    - cleanup | bool
    - libvirt_required | bool

- name: LIBVIRT - Clean libvirt storage pools and images
  import_tasks: clean_libvirt_storage.yml
  when:
    - cleanup | bool
    - libvirt_required | bool

- name: LIBVIRT - Clean libvirt networks
  import_tasks: clean_libvirt_networks.yml
  when:
    - cleanup | bool
    - libvirt_required | bool

- name: NETWORKING - Clean network profiles
  import_tasks: clean_network_profiles.yml
  when:
    - cleanup | bool
    - not create | bool

# Create process

- name: NETWORKING - Create network profiles
  import_tasks: create_network_profiles.yml
  when: create | bool

- name: LIBVIRT - Configure libvirt networks
  import_tasks: create_libvirt_networks.yml
  when:
    - create | bool
    - libvirt_required | bool

- name: LIBVIRT - Configure libvirt storage pools and images
  import_tasks: create_libvirt_storage.yml
  when:
    - create | bool
    - libvirt_required | bool

- name: LIBVIRT - Configure libvirt domains
  import_tasks: create_libvirt_domains.yml
  when:
    - create | bool
    - libvirt_required | bool

- name: VIRTUALBMC - Configure VirtualBMC
  import_tasks: create_virtualbmc.yml
  when:
    - create | bool
    - vbmc_required | bool

- name: FIREWALL - Configure firewall
  import_tasks: configure_firewall.yml
  when: create | bool

- name: DHCRELAY - Configure DHCP relay
  import_tasks: configure_dhcrelay.yml
  when:
    - create | bool
    - dcn_leafs | length > 0