- name: NETWORKING - Define bridges for networks linked with the hypervisor
  set_fact:
    network_connections: "{{ (network_connections | default([])) + [connection] }}"
  vars:
    ip:
      dhcp4: no
      auto6: no
      address:
        - "{% if item.ipv4 is defined %}{{ (item.ipv4.address ~ '/' ~ item.ipv4.netmask) | ipaddr('host/prefix') }}{% endif %}"
    noip:
      dhcp4: no
      auto6: no
    connection:
      name: "{{ item.bridge }}"
      interface_name: "{{ item.bridge }}"
      type: bridge
      autoconnect: yes
      # The bridge is created on every hypervisor listed in `hypervisor`, but only the primary (first) host gets the gateway IP.
      ip: "{% if item.ipv4 is defined and inventory_hostname == item.hypervisor.split(',')[0] %}{{ ip }}{% else %}{{ noip }}{% endif %}"
      mtu: 1500
      state: up
  when:
    - bridges_required | bool
    - inventory_hostname in item.hypervisor.split(',')
    - (item.forward == 'bridge')
  loop: "{{ libvirt_networks }}"

- name: NETWORKING - Get existing NetworkManager connection profile names
  command: "nmcli -t -f NAME connection show"
  become: true
  register: existing_nm_connections
  changed_when: false
  when: bridges_required | bool

# A NIC NetworkManager has never seen (no profile at all, so it may be "unmanaged")
# sometimes can't be cleanly enslaved into a bridge in one step; claim it into
# management with a plain profile first, but only the first time - once a profile
# named after it exists (e.g. the bridge-port one below), skip this to avoid
# detaching/reattaching it from the bridge on every run.
- name: NETWORKING - Define hypervisor interfaces (first-run only, to adopt a previously-unmanaged NIC into NetworkManager)
  set_fact:
    network_connections: "{{ (network_connections | default([])) + [connection] }}"
  vars:
    connection:
      name: "{{ item.hypervisor_if }}"
      interface_name: "{{ item.hypervisor_if }}"
      type: ethernet
      autoconnect: yes
      ip:
        dhcp4: no
        auto6: no
      mtu: 1500
      state: up
  when:
    - inventory_hostname in item.hypervisor.split(',')
    - (item.forward == 'bridge') and (item.hypervisor_if is defined)
    - item.hypervisor_if not in (existing_nm_connections.stdout_lines | default([]))
  loop: "{{ libvirt_networks }}"

- name: NETWORKING - Define network configuration for interfaces bridged to libvirt
  set_fact:
    network_connections: "{{ (network_connections | default([])) + [connection] }}"
  vars:
    connection:
      name: "{{ item.hypervisor_if }}"
      interface_name: "{{ item.hypervisor_if }}"
      type: ethernet
      controller: "{{ item.bridge }}"
      port_type: bridge
      autoconnect: yes
      mtu: 1500
      state: up
  when:
    - inventory_hostname in item.hypervisor.split(',')
    - (item.forward == 'bridge') and (item.hypervisor_if is defined)
  loop: "{{ libvirt_networks }}"

- name: NETWORKING - Define network configuration for vlans belonging to libvirt bridges in localhost
  set_fact:
    network_connections: "{{ (network_connections | default([])) + [connection] }}"
  vars:
    connection:
      name: "{{ item.bridge }}.{{ item.subnet.vlan }}"
      type: vlan
      vlan_id: "{{ item.subnet.vlan }}"
      parent: "{{ item.bridge }}"
      autoconnect: yes
      mtu: "{{ item.mtu | default(1500) }}"
      state: "{{ 'up' if item.subnet.gateway is defined else 'present' }}"
      ip:
        dhcp4: no
        auto6: no
        # Only networks declaring a gateway get an address here (that address IS the
        # gateway); otherwise the VLAN is a pure L2 trunk endpoint.
        address: "{{ [item.subnet.gateway ~ '/' ~ (item.subnet.ip_subnet | ipaddr('prefix'))] if item.subnet.gateway is defined else [] }}"
  when:
    - bridges_required | bool
    - inventory_hostname == 'localhost'
    - item.subnet.vlan is defined
  loop: "{{ default_leaf.networks }}"

- name: NETWORKING - Define network configuration for vlans belonging to libvirt bridges in the leafs
  set_fact:
    network_connections: "{{ (network_connections | default([])) + [connection] }}"
  vars:
    connection:
      name: "{{ item.1.bridge }}.{{ item.1.subnet.vlan }}"
      type: vlan
      vlan_id: "{{ item.1.subnet.vlan }}"
      parent: "{{ item.1.bridge }}"
      autoconnect: yes
      mtu: "{{ item.1.mtu | default(1500) }}"
      state: "{{ 'up' if item.1.subnet.gateway is defined else 'present' }}"
      ip:
        dhcp4: no
        auto6: no
        address: "{{ [item.1.subnet.gateway ~ '/' ~ (item.1.subnet.ip_subnet | ipaddr('prefix'))] if item.1.subnet.gateway is defined else [] }}"
  when:
    - inventory_hostname == item.0.hypervisor.split(',')[0]
    - item.1.subnet.vlan is defined
  with_subelements:
    - "{{ dcn_leafs }}"
    - networks

# Skip these DCN-hypervisor routes (and the external_if fact dereference) when there are no DCN leafs.
- name: NETWORKING - Register DCN hypervisor routes
  set_fact:
    hypervisor_routes: |-
      [
        {
          "network": "{{ default_leaf.ctlplane_subnet.cidr | ipaddr('network') }}",
          "prefix": "{{ default_leaf.ctlplane_subnet.cidr | ipaddr('prefix') }}",
          "gateway": "{{ hostvars['localhost']['ansible_'~external_if].ipv4.address }}"
        },
      {% for net in default_leaf.networks %}
        {
          "network": "{{ net.subnet.ip_subnet | ipaddr('network') }}",
          "prefix": "{{ net.subnet.ip_subnet | ipaddr('prefix') }}",
          "gateway": "{{ hostvars['localhost']['ansible_'~external_if].ipv4.address }}"
        },
      {% endfor %}
      {% for leaf in dcn_leafs if (inventory_hostname not in leaf.hypervisor.split(',')) %}
      {% set leaf_primary = leaf.hypervisor.split(',')[0] %}
        {
          "network": "{{ leaf.ctlplane_subnet.cidr | ipaddr('network') }}",
          "prefix": "{{ leaf.ctlplane_subnet.cidr | ipaddr('prefix') }}",
          "gateway": "{{ hostvars[leaf_primary]['ansible_'~(hostvars[leaf_primary].hypervisor_external_if)].ipv4.address }}"
        },
      {% for net in leaf.networks %}
        {
          "network": "{{ net.subnet.ip_subnet | ipaddr('network') }}",
          "prefix": "{{ net.subnet.ip_subnet | ipaddr('prefix') }}",
          "gateway": "{{ hostvars[leaf_primary]['ansible_'~(hostvars[leaf_primary].hypervisor_external_if)].ipv4.address }}"
        },
      {% endfor %}
      {% endfor %}
      ]
  when: dcn_leafs | length > 0

- name: NETWORKING - Define network configuration for the public interface of the DCN hypervisors and add static route
  set_fact:
    network_connections: "{{ (network_connections | default([])) + [connection] }}"
  vars:
    connection:
      name: "{{ hypervisor_external_if }}"
      interface_name: "{{ hypervisor_external_if }}"
      type: ethernet
      autoconnect: yes
      mtu: 1500
      state: up
      ip:
        dhcp4: yes
        route: "{{ hypervisor_routes }}"
  when:
    - dcn_leafs | length > 0
    - inventory_hostname != 'localhost'

- name: Register localhost routes
  set_fact:
    localhost_routes: |-
      [
      {% for leaf in dcn_leafs %}
      {% set leaf_primary = leaf.hypervisor.split(',')[0] %}
        {
          "network": "{{ leaf.ctlplane_subnet.cidr | ipaddr('network') }}",
          "prefix": "{{ leaf.ctlplane_subnet.cidr | ipaddr('prefix') }}",
          "gateway": "{{ hostvars[leaf_primary]['ansible_'~(hostvars[leaf_primary].hypervisor_external_if)].ipv4.address }}"
        },
      {% for net in leaf.networks %}
        {
          "network": "{{ net.subnet.ip_subnet | ipaddr('network') }}",
          "prefix": "{{ net.subnet.ip_subnet | ipaddr('prefix') }}",
          "gateway": "{{ hostvars[leaf_primary]['ansible_'~(hostvars[leaf_primary].hypervisor_external_if)].ipv4.address }}"
        },
      {% endfor %}
      {% endfor %}
      ]

- name: NETWORKING - Define network configuration for the public interface of the localhost hypervisor and add static routes
  set_fact:
    network_connections: "{{ (network_connections | default([])) + [connection] }}"
  vars:
    connection:
      name: "{{ external_if }}"
      interface_name: "{{ external_if }}"
      type: ethernet
      autoconnect: yes
      mtu: 1500
      state: up
      ip:
        dhcp4: yes
        route: "{{ localhost_routes }}"
  when: inventory_hostname == 'localhost'

- name: NETWORKING - Configure network using system role
  import_role:
    name: rhel-system-roles.network
  vars:
    network_allow_restart: yes

- name: NETWORKING - Gather facts again to get interfaces
  setup: