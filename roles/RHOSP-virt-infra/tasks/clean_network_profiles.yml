# Cleanup is intentionally ungated: it must remove whatever a previous run created.
# Marking an already-absent connection absent is an idempotent no-op.

# First pass: remove VLAN sub-interfaces. Must be separate from bridge removal because
# rhel-system-roles.network validates parent references. Include parent bridges as
# persistent_state: present (no change) so they're defined for validation.
- name: NETWORKING - Delete vlans belonging to libvirt bridges in localhost
  set_fact:
    vlan_connections_to_remove: "{{ (vlan_connections_to_remove | default([])) + [connection] }}"
  vars:
    connection:
      name: "{{ item.bridge }}.{{ item.subnet.vlan }}"
      type: vlan
      vlan_id: "{{ item.subnet.vlan }}"
      parent: "{{ item.bridge }}"
      state: down
      persistent_state: absent
  when:
    - inventory_hostname == 'localhost'
    - item.subnet.vlan is defined
  loop: "{{ default_leaf.networks }}"

- name: NETWORKING - Delete vlans belonging to libvirt bridges in the leafs
  set_fact:
    vlan_connections_to_remove: "{{ (vlan_connections_to_remove | default([])) + [connection] }}"
  vars:
    connection:
      name: "{{ item.1.bridge }}.{{ item.1.subnet.vlan }}"
      type: vlan
      vlan_id: "{{ item.1.subnet.vlan }}"
      parent: "{{ item.1.bridge }}"
      state: down
      persistent_state: absent
  when:
    - inventory_hostname == item.0.hypervisor.split(',')[0]
    - item.1.subnet.vlan is defined
  with_subelements:
    - "{{ dcn_leafs }}"
    - networks

- name: NETWORKING - Include parent bridges in VLAN removal pass (for validation)
  set_fact:
    vlan_connections_to_remove: "{{ (vlan_connections_to_remove | default([])) + [connection] }}"
  vars:
    connection:
      name: "{{ item.bridge }}"
      interface_name: "{{ item.bridge }}"
      type: bridge
      persistent_state: present
  when:
    - inventory_hostname in item.hypervisor.split(',')
    - item.forward == 'bridge'
    - (default_leaf.networks | selectattr('bridge', 'equalto', item.bridge) | selectattr('subnet.vlan', 'defined') | list | length > 0) or
      (dcn_leafs | map(attribute='networks') | list | flatten | selectattr('bridge', 'equalto', item.bridge) | selectattr('subnet.vlan', 'defined') | list | length > 0)
  loop: "{{ libvirt_networks }}"

- name: NETWORKING - Remove VLAN connections with system role (first pass)
  import_role:
    name: rhel-system-roles.network
  vars:
    network_connections: "{{ vlan_connections_to_remove | default([]) }}"
    network_allow_restart: no
  when: vlan_connections_to_remove | default([]) | length > 0

# Second pass: remove bridges and interfaces (parent bridge can now be removed safely).
- name: NETWORKING - Delete bridges for networks linked with the hypervisor
  set_fact:
    network_connections: "{{ (network_connections | default([])) + [connection] }}"
  vars:
    connection:
      name: "{{ item.bridge }}"
      interface_name: "{{ item.bridge }}"
      type: bridge
      state: down
      persistent_state: absent
  when:
    - inventory_hostname in item.hypervisor.split(',')
    - item.forward == 'bridge'
  loop: "{{ libvirt_networks }}"

- name: NETWORKING - Delete hypervisor interfaces
  set_fact:
    network_connections: "{{ (network_connections | default([])) + [connection] }}"
  vars:
    connection:
      name: "{{ item.hypervisor_if }}"
      interface_name: "{{ item.hypervisor_if }}"
      type: ethernet
      state: down
      persistent_state: absent
  when:
    - inventory_hostname in item.hypervisor.split(',')
    - (item.forward == 'bridge') and (item.hypervisor_if is defined)
  loop: "{{ libvirt_networks }}"

- name: NETWORKING - Define only the network configuration for the public interface of the DCN hypervisors without static routes
  set_fact:
    network_connections: "{{ (network_connections | default([])) + [connection] }}"
  vars:
    connection:
      name: "{{ hypervisor_external_if }}"
      interface_name: "{{ hypervisor_external_if }}"
      type: ethernet
      autoconnect: yes
      state: up
      ip:
        dhcp4: yes
  when: inventory_hostname != 'localhost'

- name: NETWORKING - Define only the network configuration for the public interface of the localhost hypervisor without static routes
  set_fact:
    network_connections: "{{ (network_connections | default([])) + [connection] }}"
  vars:
    connection:
      name: "{{ external_if }}"
      interface_name: "{{ external_if }}"
      type: ethernet
      autoconnect: yes
      state: up
      ip:
        dhcp4: yes
  when: inventory_hostname == 'localhost'

- name: NETWORKING - Configure network using system role (second pass)
  import_role:
    name: rhel-system-roles.network
  vars:
    network_allow_restart: yes

- name: NETWORKING - Gather facts again to get interfaces
  setup: