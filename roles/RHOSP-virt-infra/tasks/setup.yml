- name: SETUP - Ensure the ssh directory exists
  file:
    path: "/home/{{ ansible_user }}/.ssh"
    state: directory
  when: inventory_hostname == 'localhost'

- name: SETUP - Check if the ssh keypair exists
  stat:
    path: "/home/{{ ansible_user }}/.ssh/id_rsa"
  register: keypair
  when: inventory_hostname == 'localhost'

- name: SETUP - Create ssh key
  openssh_keypair:
    path: "/home/{{ ansible_user }}/.ssh/id_rsa"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
  when:
    - inventory_hostname == 'localhost'
    - not keypair.stat.exists

- name: SETUP - Get ssh public key into variable
  set_fact:
    ssh_public_key: "{{ lookup('file', '/home/{{ ansible_user }}/.ssh/id_rsa.pub') }}"
  when: inventory_hostname == 'localhost'

- name: SETUP - Ensure packages are installed
  yum:
    name: "{{ RHEL_version_supported[ansible_distribution_version].packages }}"
    state: present
  become: yes

- name: SETUP - Ensure the needed groups exist
  group:
    name: "{{ item }}"
    state: present
  loop:
    - libvirt
    - kvm

- name: SETUP - Ensure the user belongs to the proper groups
  user:
    name: "{{ ansible_user }}"
    groups:
      - libvirt
      - kvm
    append: yes

- name: SETUP - Ensure required services are enabled and running
  systemd:
    name: "{{ item }}"
    state: started
    enabled: yes
  become: yes
  loop: "{{ libvirt_units + ['NetworkManager.service', 'firewalld.service'] }}"

# On RHEL 7.9/8.4 the system interpreter is not externally managed, so pip
# packages are installed into it as before.
- name: SETUP - Update pip (legacy system interpreter)
  pip:
    name: pip
    executable: "pip3"
    state: latest
  when: ansible_distribution_major_version | int < 9

- name: SETUP - Install packages from pip (legacy system interpreter)
  pip:
    name: "{{ RHEL_version_supported[ansible_distribution_version].pip }}"
    executable: "pip3"
  when:
    - RHEL_version_supported[ansible_distribution_version].pip is defined
    - ansible_distribution_major_version | int < 9

# On RHEL 9/10 the system interpreter is externally managed (PEP 668), so
# VirtualBMC is installed into a dedicated venv instead (netaddr comes from
# the python3-netaddr RPM for the Ansible controller's ipaddr filters).
- name: SETUP - Install packages from pip into a dedicated venv (PEP 668)
  pip:
    name: "{{ RHEL_version_supported[ansible_distribution_version].pip }}"
    virtualenv: "{{ vbmc_venv }}"
    virtualenv_command: "python3 -m venv"
  when:
    - RHEL_version_supported[ansible_distribution_version].pip is defined
    - ansible_distribution_major_version | int >= 9
  become: yes

- name: SETUP - Create stack alias to connect to undercloud
  lineinfile:
    path: "/home/{{ ansible_user }}/.bashrc"
    line: "alias stack='ssh stack@undercloud'"
    insertafter: EOF
    state: present
  when: inventory_hostname == 'localhost'

- name: SETUP - Create VirtualBMC systemd unit
  template:
    src: "vbmcd.service.j2"
    dest: "/etc/systemd/system/vbmcd.service"
    owner: root
    group: root
    mode: "0644"
  become: yes

- name: SETUP - Reload systemd daemon
  systemd:
    daemon_reload: yes
  become: yes

- name: SETUP - Enable and start vbmcd service
  service:
    name: vbmcd
    state: started
    enabled: yes
  become: yes

- name: SETUP - Determine the KVM module for the host CPU vendor
  set_fact:
    kvm_module: >-
      {{ 'kvm_intel' if ('GenuineIntel' in (ansible_processor | join(' ')))
         else ('kvm_amd' if ('AuthenticAMD' in (ansible_processor | join(' ')))
         else '') }}

- name: SETUP - Read the nested virtualization parameter
  slurp:
    src: "/sys/module/{{ kvm_module }}/parameters/nested"
  register: nested_slurp
  become: yes
  when: kvm_module | length > 0
  failed_when: false

- name: SETUP - Register whether nested virtualization is enabled
  set_fact:
    nested_enabled: >-
      {{ (kvm_module | length > 0)
         and (nested_slurp.content is defined)
         and ((nested_slurp.content | b64decode | trim) in ['1', 'Y']) }}

- name: SETUP - Enable nested virtualization if needed
  lineinfile:
    path: /etc/modprobe.d/kvm.conf
    regexp: "^options {{ kvm_module }}"
    insertafter: "^#options {{ kvm_module }}"
    line: "options {{ kvm_module }} nested=1"
    create: yes
  when:
    - kvm_module | length > 0
    - not nested_enabled | bool
  become: yes

- name: SETUP - Notify to restart the machine if nested virtualization is disabled
  fail:
    msg: "Please restart the machine '{{ inventory_hostname }}' to enable nested virtualization and then run the playbook again."
  when:
    - kvm_module | length > 0
    - not nested_enabled | bool
