- name: CHECKS - Verify the OS Version is supported
  fail:
    msg: "The RHEL version (RHEL {{ ansible_distribution_version }}) is not supported by this role."
  when:
    - RHEL_version_supported[ansible_distribution_version] is not defined

- name: CHECKS - Verify the RHOSP version selected is supported
  fail:
    msg: "The selected RHOSP version ({{ RHOSP_version }}) is not supported by this role."
  when:
    - inventory_hostname == 'localhost'
    - RHOSP_version_supported[RHOSP_version] is not defined

# Deployed-server (pre_provisioned) and ironic-provisioned overcloud nodes cannot be
# mixed in the same deployment: every overcloud node must share the same
# `pre_provisioned` value. Only `machines` (the overcloud nodes) are considered - the
# undercloud lives in its own variable and is exempt. A node with no `pre_provisioned`
# key defaults to unprovisioned, so the deployment is mixed when some (but not all) of
# the nodes are pre_provisioned: true.
# TODO(leafs): this is a GLOBAL check for now. Once the leaf model is refactored so
# `openstack.leaf` is the single leaf identifier for both VMs and physical nodes,
# make this per-leaf (a leaf, not the whole deployment, is the unit that cannot mix
# pre_provisioned values) - see the leaf-membership tests in the undercloud templates.
- name: CHECKS - Fail if pre-provisioned and unprovisioned overcloud nodes are mixed
  vars:
    preprovisioned_count: "{{ machines | selectattr('pre_provisioned', 'defined') | selectattr('pre_provisioned', 'equalto', true) | list | length }}"
  fail:
    msg: >-
      vars/machines.yml mixes deployed-server (pre_provisioned: true) and
      ironic-provisioned (pre_provisioned: false, the default) overcloud nodes. Every
      overcloud node must share the same pre_provisioned value (the undercloud is
      defined separately and is exempt).
  when:
    - inventory_hostname == 'localhost'
    - preprovisioned_count | int > 0
    - preprovisioned_count | int < (machines | length)

# The capacity checks below only make sense when this host builds VMs; skip them
# when there are no libvirt machines (a physical undercloud and no libvirt nodes).
- name: CHECKS - Get total hypervisor memory planned
  set_fact:
    total_hypervisor_memory_mb: "{{ ((libvirt_machines | selectattr('libvirt.hypervisor', 'equalto', inventory_hostname) | map(attribute='libvirt.memory') | list) | sum) / 1024 }}"
  when: libvirt_required | bool

- name: CHECKS - Check RAM usage wont be larger than the hypervisor capacity
  fail:
    msg: Please check your machines.yml file and make sure the memory usage ({{ total_hypervisor_memory_mb | int }} MB) is not larger than the hypervisor capacity ({{ ansible_memory_mb.real.total | int }} MB) considering 8192 MB for the host.
  when:
    - libvirt_required | bool
    - total_hypervisor_memory_mb | int + 8192 > ansible_memory_mb.real.total | int

- name: CHECKS - Get total hypervisor cpus planned
  set_fact:
    total_hypervisor_cpus: "{{ ((libvirt_machines | selectattr('libvirt.hypervisor', 'equalto', inventory_hostname) | map(attribute='libvirt.cpus') | list) | sum) }}"
  when: libvirt_required | bool

- name: CHECKS - Check CPU usage wont be larger than the hypervisor capacity
  fail:
    msg: Please check your machines.yml file and make sure the vcpus usage ({{ total_hypervisor_cpus | int }}) is not larger than the hypervisor capacity ({{ ansible_processor_vcpus | int }}) considering 2 CPUs for the host.
  when:
    - libvirt_required | bool
    - total_hypervisor_cpus | int + 2 > ansible_processor_vcpus | int