# The libvirt firewalld zone only holds the NAT/management libvirt networks and the
# vbmc ports, so it is only needed when there are libvirt resources.
- name: FIREWALLD - Ensure libvirt zone exists
  firewalld:
    zone: libvirt
    state: present
    permanent: yes
  become: yes
  register: firewalld_create_zone
  when: libvirt_required | bool

- name: FIREWALLD - Reload firewall after creating the zone
  command: "firewall-cmd --reload"
  become: yes
  when: firewalld_create_zone.changed

- name: FIREWALL - Ensure the external libvirt network interface and bridge type libvirt network interfaces belong to public zone
  firewalld:
    zone: public
    interface: "{{ item.bridge }}"
    permanent: yes
    immediate: yes
    state: enabled
  loop: "{{ networks }}"
  when:
    - bridges_required | bool
    - inventory_hostname == item.hypervisor
    - (item.name == forward_network) or (item.forward == 'bridge')

- name: FIREWALL - Ensure the other interfaces belong to libvirt zone
  firewalld:
    zone: libvirt
    interface: "{{ item.bridge }}"
    permanent: yes
    immediate: yes
    state: enabled
  loop: "{{ networks }}"
  when:
    - libvirt_required | bool
    - inventory_hostname == item.hypervisor
    - (item.name != forward_network) and (item.forward != 'bridge')

# Masquerade on the public zone is always needed (external access / port forwarding);
# the libvirt zone only exists when there are libvirt resources.
- name: FIREWALL - Enable masquerade in the firewall to allow external traffic
  firewalld:
    zone: "{{ item }}"
    masquerade: yes
    permanent: yes
    immediate: yes
    state: enabled
  loop: "{{ ['public'] + (['libvirt'] if (libvirt_required | bool) else []) }}"
  become: yes

- name: FIREWALL - Set port forwarding rules
  firewalld:
    rich_rule: rule family=ipv4 forward-port port={{ item }} protocol=tcp to-port={{ item }} to-addr={{ overcloud_ip }}
    zone: public
    permanent: yes
    immediate: yes
    state: enabled
  loop: "{{ forwarded_ports }}"
  when: inventory_hostname == 'localhost'

- name: FIREWALL - Ensure vbmc ports rules are configured to the firewall in libvirt zone for localhost
  firewalld:
    port: "{{ item.pm.port }}/udp"
    zone: "libvirt"
    permanent: yes
    immediate: yes
    state: enabled
  loop: "{{ libvirt_machines }}"
  become: yes
  when:
    - vbmc_required | bool
    - item.pm is defined
    - inventory_hostname == DefaultLeaf0.hypervisor

- name: FIREWALL - Ensure vbmc ports rules are configured to the firewall in public zone for localhost and leafs
  firewalld:
    port: "{{ item.pm.port }}/udp"
    zone: "public"
    permanent: yes
    immediate: yes
    state: enabled
  loop: "{{ libvirt_machines }}"
  become: yes
  when:
    - vbmc_required | bool
    - item.pm is defined
    - inventory_hostname == item.libvirt.hypervisor
