- name: NETWORKS - Create libvirt hooks directory
  file:
    path: "/etc/libvirt/hooks"
    state: directory
    mode: "755"
    owner: root
    group: root
  when: inventory_hostname == 'localhost'

- name: NETWORKS - Add hook for libvirt networks (hack) to re-apply the host FORWARD rules libvirt wipes on restart
  template:
    src: "network-hook.j2"
    dest: "/etc/libvirt/hooks/network"
    mode: "755"
    owner: root
    group: root
  become: yes
  notify: HANDLER - restart libvirtd service
  when:
    - inventory_hostname == 'localhost'
    # The forward:bridge gateway bridges rely on a host FORWARD ACCEPT rule that libvirt
    # shadows with a FORWARD REJECT on every (re)start. Install the hook whenever such a
    # bridge exists on localhost so the rule is re-applied on each network event.
    - (libvirt_networks | selectattr('forward', 'equalto', 'bridge') | selectattr('ipv4', 'defined') | selectattr('hypervisor', 'search', 'localhost') | list | length) > 0

- name: NETWORKS - Gather facts about libvirt networks
  community.libvirt.virt_net:
    command: facts

- name: NETWORKS - Define the network from the template
  community.libvirt.virt_net:
    command: define
    name: "{{ item.name }}"
    xml: "{{ lookup('template', 'network.xml.j2') }}"
  loop: "{{ libvirt_networks }}"
  become: yes
  when:
    - inventory_hostname in item.hypervisor.split(',')
    - ansible_libvirt_networks[item.name] is not defined

- name: NETWORKS - Gather facts about libvirt networks again
  community.libvirt.virt_net:
    command: facts

- name: NETWORKS - Activate the network
  community.libvirt.virt_net:
    state: active
    name: "{{ item.name }}"
  loop: "{{ libvirt_networks }}"
  become: yes
  when:
    - inventory_hostname in item.hypervisor.split(',')
    - ansible_libvirt_networks[item.name]['state'] != 'active'

- name: NETWORKS - Enable autostart for the network
  community.libvirt.virt_net:
    autostart: yes
    name: "{{ item.name }}"
  loop: "{{ libvirt_networks }}"
  become: yes
  when:
    - inventory_hostname in item.hypervisor.split(',')
    - ansible_libvirt_networks[item.name]['autostart'] != 'yes'
