- name: NETWORKS - Create libvirt hooks directory
  file:
    path: "/etc/libvirt/hooks"
    state: directory
    mode: "755"
    owner: root
    group: root
  when: inventory_hostname == 'localhost'

- name: NETWORKS - Add hook for libvirt networks (hack) in order to allow port-forwarding when the network is forwarding route
  template:
    src: "network-hook.j2"
    dest: "/etc/libvirt/hooks/network"
    mode: "755"
    owner: root
    group: root
  become: yes
  notify: HANDLER - restart libvirtd service
  when:
    - inventory_hostname == 'localhost'
    # This hook is only needed for a NAT external network. In the leaf model every
    # bridge is forward:bridge, so it stays disabled (port forwarding is handled by the
    # firewalld rich rules in configure_firewall.yml); it fires if a NAT external network
    # is ever added.
    - (libvirt_networks | selectattr('name', 'search', 'external') | selectattr('forward', 'equalto', 'nat') | list | length) > 0

- name: NETWORKS - Gather facts about libvirt networks
  community.libvirt.virt_net:
    command: facts

- name: NETWORKS - Define the network from the template
  community.libvirt.virt_net:
    command: define
    name: "{{ item.name }}"
    xml: "{{ lookup('template', 'network.xml.j2') }}"
  loop: "{{ libvirt_networks }}"
  become: yes
  when:
    - inventory_hostname in item.hypervisor.split(',')
    - ansible_libvirt_networks[item.name] is not defined

- name: NETWORKS - Gather facts about libvirt networks again
  community.libvirt.virt_net:
    command: facts

- name: NETWORKS - Activate the network
  community.libvirt.virt_net:
    state: active
    name: "{{ item.name }}"
  loop: "{{ libvirt_networks }}"
  become: yes
  when:
    - inventory_hostname in item.hypervisor.split(',')
    - ansible_libvirt_networks[item.name]['state'] != 'active'

- name: NETWORKS - Enable autostart for the network
  community.libvirt.virt_net:
    autostart: yes
    name: "{{ item.name }}"
  loop: "{{ libvirt_networks }}"
  become: yes
  when:
    - inventory_hostname in item.hypervisor.split(',')
    - ansible_libvirt_networks[item.name]['autostart'] != 'yes'
