---
# defaults file for RHOSP-kubevirt-infra

# RHOSP version
RHOSP_version: 17.1
RHOSP_release: latest

# Custom RHEL image: set URL to use a custom image. If it's a local file, use "file://<full_path>"
CustomRhelImage: "{{ RHOSP_version_supported[RHOSP_version].rhel_image.url }}"

# Custom RHEL image storage size for KubeVirt DataVolume PVC
CustomRhelImageSize: "20Gi"

# Cleaning and creating parameters
cleanup: False
create: True

# overcloud parameters
# Leaf configuration: kubevirt only supports the default control-plane leaf (overcloud); DCN is not supported. See README.
leafs:
- name: overcloud
  additional_bridges:
  - name: br-tenant
    interface: null
  - name: br-storage
    interface: null
  - name: br-internalapi
    interface: null
  - name: br-storagemgmt
    interface: null
  - name: br-external
    interface: null
  ctlplane_bridge:
    name: br-ctlplane
    interface: null
  ctlplane_subnet:
    name: ctlplane-subnet
    cidr: 192.168.24.0/24
    dhcp_start: 192.168.24.5
    dhcp_end: 192.168.24.99
    inspection_iprange: 192.168.24.100,192.168.24.120
    gateway: 192.168.24.1
    masquerade: true
  networks:
  - name: Tenant
    bridge: br-tenant
    vip: false
    mtu: 1500
    subnet:
      ip_subnet: 172.16.0.0/24
      allocation_pools:
      - start: 172.16.0.5
        end: 172.16.0.99
  - name: Storage
    bridge: br-storage
    vip: true
    mtu: 1500
    subnet:
      ip_subnet: 172.16.1.0/24
      allocation_pools:
      - start: 172.16.1.5
        end: 172.16.1.99
  - name: InternalApi
    bridge: br-internalapi
    vip: true
    mtu: 1500
    subnet:
      ip_subnet: 172.16.2.0/24
      allocation_pools:
      - start: 172.16.2.5
        end: 172.16.2.99
  - name: StorageMgmt
    bridge: br-storagemgmt
    vip: true
    mtu: 1500
    subnet:
      ip_subnet: 172.16.3.0/24
      allocation_pools:
      - start: 172.16.3.5
        end: 172.16.3.99
  - name: External
    bridge: br-external
    vip: true
    mtu: 1500
    subnet:
      ip_subnet: 10.0.0.0/24
      allocation_pools:
      - start: 10.0.0.5
        end: 10.0.0.99
      gateway: 10.0.0.254
      vip: 10.0.0.253

# The director host (kubevirt VM; role-injected constants; always pre_provisioned, implicit). See README.
undercloud:
  type: kubevirt
  openstack:
    local_interface: eth1  # eth0 is pod network in kubevirt VMs
  kubevirt:
    title: 'RHOSPVirtLab Undercloud'
    cpus: 2
    memory: 6Gi
    disks:
      - root: true
        size: 100Gi
    network:
      interfaces:
        - name: ctlplane
          mac: '0c:1f:0d:10:00:00'
          bridge: br-ctlplane

# The overcloud nodes (default: one controller + one compute); always pre_provisioned: true until KubeVirtBMC adds power management (https://github.com/kubevirtbmc/kubevirtbmc). See README.
machines:
  - name: controller0
    type: kubevirt
    pre_provisioned: true
    openstack:
      role: controller
    # pm:
    #   type: ipmi
    #   user: admin
    #   password: admin
    #   address: localhost
    #   port: 6231
    #   mode: bios
    kubevirt:
      title: 'RHOSPVirtLab Virtual Controller 0'
      cpus: 2
      memory: 8Gi
      disks:
        - root: true
          size: 50Gi
      network:
        interfaces:
          - name: ctlplane
            mac: '0c:1f:0d:11:00:00'
            bridge: br-ctlplane
          - name: tenant
            mac: '0c:1f:0d:11:00:01'
            bridge: br-tenant
          - name: internalapi
            mac: '0c:1f:0d:11:00:02'
            bridge: br-internalapi
          - name: storage
            mac: '0c:1f:0d:11:00:03'
            bridge: br-storage
          - name: storagemgmt
            mac: '0c:1f:0d:11:00:04'
            bridge: br-storagemgmt
          - name: external
            mac: '0c:1f:0d:11:00:05'
            bridge: br-external
  - name: compute0
    type: kubevirt
    pre_provisioned: true
    openstack:
      role: compute
    # pm:
    #   type: ipmi
    #   user: admin
    #   password: admin
    #   address: localhost
    #   port: 6234
    #   mode: bios
    kubevirt:
      title: 'RHOSPVirtLab Virtual Compute 0'
      cpus: 4
      memory: 6Gi
      disks:
        - root: true
          size: 50Gi
      network:
        interfaces:
          - name: ctlplane
            mac: '0c:1f:0d:12:00:00'
            bridge: br-ctlplane
          - name: tenant
            mac: '0c:1f:0d:12:00:01'
            bridge: br-tenant
          - name: internalapi
            mac: '0c:1f:0d:12:00:02'
            bridge: br-internalapi
          - name: storage
            mac: '0c:1f:0d:12:00:03'
            bridge: br-storage
          - name: storagemgmt
            mac: '0c:1f:0d:12:00:04'
            bridge: br-storagemgmt
          - name: external
            mac: '0c:1f:0d:12:00:05'
            bridge: br-external

# Credentials (lab-only weak defaults; override via vault_credentials.yaml — see README).
# BMC/IPMI credentials for KubeVirtBMC endpoints (not yet implemented: https://github.com/kubevirtbmc/kubevirtbmc).
#BmcUsername: admin
#BmcPassword: admin
# Passwords baked into each VM's cloud-init (root and the overcloud SSH user account).
VmRootPassword: redhat
VmStackPassword: redhat

# Namespace in Kubevirt where the resources will be created
KubeVirtNamespace: default

# StorageClass, VolumeMode and AccessMode to be used for the creation of all persistent storage resources
KubeVirtStorageClass: lvms-vg1
KubeVirtVolumeMode: Filesystem
KubeVirtAccessMode: ReadWriteMany

# Kubevirt additional labels to add to specific resources
# - key: KEY
#   value: VALUE
KubevirtLabels:
  VirtualMachines: []
  VirtualMachineInstances: []
  Services: []
  Routes: []

# Domain to use for routes in Kubevirt
KubeVirtRoutesDomain: cluster.redhat.lab