- name: SETUP - Ensure kubernetes client packages are installed
  yum:
    name: "{{ RHEL_version_supported[ansible_distribution_version].packages }}"
    state: present
  become: yes
  when: RHEL_version_supported[ansible_distribution_version].packages | default([]) | length > 0

- name: SETUP - Install kubernetes client via pip (legacy interpreters)
  pip:
    name: "{{ RHEL_version_supported[ansible_distribution_version].pip }}"
    executable: "pip3"
  when:
    - RHEL_version_supported[ansible_distribution_version].pip is defined
    - ansible_distribution_major_version | int < 9

- name: SETUP - Ensure ~/bin directory exists for oc tool
  file:
    path: "/home/{{ ansible_user }}/bin"
    state: directory
    mode: '0755'

- name: SETUP - Download openshift-client for RHEL 10.2
  get_url:
    url: "{{ CustomOcClientUrl | default('https://mirror.openshift.com/pub/openshift-v4/clients/ocp/latest/openshift-client-linux.tar.gz') }}"
    dest: "/tmp/openshift-client-linux.tar.gz"
    mode: '0644'
  when:
    - ansible_distribution_major_version | int >= 9

- name: SETUP - Extract openshift-client to ~/bin
  shell: |
    cd /tmp
    tar -xzf openshift-client-linux.tar.gz oc kubectl
    mv oc kubectl "/home/{{ ansible_user }}/bin/"
    chmod 0755 "/home/{{ ansible_user }}/bin/oc" "/home/{{ ansible_user }}/bin/kubectl"
    chown {{ ansible_user }}:{{ ansible_user }} "/home/{{ ansible_user }}/bin/oc" "/home/{{ ansible_user }}/bin/kubectl"
    rm -f /tmp/openshift-client-linux.tar.gz
  when:
    - ansible_distribution_major_version | int >= 9

- name: SETUP - Ensure ~/bin is in PATH
  lineinfile:
    path: "/home/{{ ansible_user }}/.bashrc"
    line: "export PATH=\"$HOME/bin:$PATH\""
    insertafter: EOF
    state: present
    regexp: "^export PATH=.*HOME/bin"

- name: SETUP - Ensure the ssh directory exists
  file:
    path: "/home/{{ ansible_user }}/.ssh"
    state: directory
  when: inventory_hostname == 'localhost'

- name: SETUP - Check if the ssh keypair exists
  stat:
    path: "/home/{{ ansible_user }}/.ssh/id_rsa"
  register: keypair
  when: inventory_hostname == 'localhost'

- name: SETUP - Create ssh key
  openssh_keypair:
    path: "/home/{{ ansible_user }}/.ssh/id_rsa"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
  when:
    - inventory_hostname == 'localhost'
    - not keypair.stat.exists

- name: SETUP - Get ssh public key into variable
  set_fact:
    ssh_public_key: "{{ lookup('file', '/home/{{ ansible_user }}/.ssh/id_rsa.pub') }}"
  when: inventory_hostname == 'localhost'

# TODO: Replace VirtualBMC with KubeVirtBMC (https://github.com/kubevirtbmc/kubevirtbmc)

- name: SETUP - Create stack alias to connect to undercloud
  lineinfile:
    path: "/home/{{ ansible_user }}/.bashrc"
    line: "alias stack='ssh stack@undercloud'"
    insertafter: EOF
    state: present
  when: inventory_hostname == 'localhost'