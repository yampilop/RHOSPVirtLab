RoleBridgeMappings:
  Default:
  - type: ovs_bridge
    name: br-vlans
    members:
    - nic1
    native: CtlPlane
    vlans: ['Tenant', 'Storage', 'InternalApi', 'StorageMgmt']
  - type: ovs_bridge
    name: br-ex
    members:
    - nic2
    native: External
    vlans: []
# If a role is not explicitly listed here, its bridges come from Default.
# Each bridge entry:
#   type    - ovs_bridge | linux_bridge | ovs_user_bridge | sriov_pf
#   name    - the bridge (or PF) name
#   members - devices on the bridge, in order (the first plain interface becomes
#             the bridge's primary MAC). A bare "nicN" is a plain interface;
#             "nicNvM" is SR-IOV VF M of nicN; a dict is a nested device
#             (ovs_dpdk_bond / ovs_dpdk_port).
#   native  - the untagged network whose IP sits on the bridge itself. "CtlPlane"
#             gets the control-plane IP + DNS + default route; a network name gets
#             that network's IP (External also gets the default route); omit for an
#             address-less bridge (e.g. a DPDK user bridge).
#   vlans   - tagged networks carried as VLAN sub-interfaces. Listed vlans are
#             filtered down to the networks the role actually carries, so the same
#             list is safe to reuse across roles.
#
# Examples (uncomment and adapt per role):
#
# # Controller with only the control-plane network on br-ex
# Controller:
# - type: ovs_bridge
#   name: br-ex
#   members: [nic1]
#   native: CtlPlane
#   vlans: []
#
# # Compute as single-nic-vlans (External also tagged on the same bridge)
# Compute:
# - type: ovs_bridge
#   name: br-ex
#   members: [nic1]
#   native: CtlPlane
#   vlans: ['Tenant', 'Storage', 'InternalApi', 'StorageMgmt', 'External']
#
# # ComputeSriov - dedicated SR-IOV PF, with VF 0 backing the External bridge
# ComputeSriov:
# - type: ovs_bridge
#   name: br-vlans
#   members: [nic1]
#   native: CtlPlane
#   vlans: ['Tenant', 'Storage', 'InternalApi', 'StorageMgmt']
# - type: ovs_bridge
#   name: br-ex
#   members: [nic2v0]          # VF 0 of nic2
#   native: External
#   vlans: []
# - type: sriov_pf
#   name: nic2
#   numvfs: 8
#
# # ComputeOvsHwOffload - as SR-IOV, but the PF in switchdev mode for HW offload
# ComputeOvsHwOffload:
# - type: ovs_bridge
#   name: br-vlans
#   members: [nic1]
#   native: CtlPlane
#   vlans: ['Tenant', 'Storage', 'InternalApi', 'StorageMgmt']
# - type: ovs_bridge
#   name: br-ex
#   members: [nic2v0]
#   native: External
#   vlans: []
# - type: sriov_pf
#   name: nic2
#   numvfs: 8
#   link_mode: switchdev
#
# # ComputeOvsDpdk - control/External on linux bridges, DPDK bond on a user bridge
# ComputeOvsDpdk:
# - type: linux_bridge
#   name: br-vlans
#   members: [nic1]
#   native: CtlPlane
#   vlans: ['Tenant', 'Storage', 'InternalApi', 'StorageMgmt']
# - type: linux_bridge
#   name: br-ex
#   members: [nic2]
#   native: External
#   vlans: []
# - type: ovs_user_bridge
#   name: br-dpdk
#   members:
#   - type: ovs_dpdk_bond
#     name: dpdkbond0
#     members:
#     - {type: ovs_dpdk_port, name: dpdk0, driver: vfio-pci, members: [nic3]}
#     - {type: ovs_dpdk_port, name: dpdk1, driver: vfio-pci, members: [nic4]}
#
# # ComputeOvsDpdkSriov - a DPDK bond built on SR-IOV VFs of the same PF (nic2)
# ComputeOvsDpdkSriov:
# - type: linux_bridge
#   name: br-vlans
#   members: [nic1]
#   native: CtlPlane
#   vlans: ['Tenant', 'Storage', 'InternalApi', 'StorageMgmt']
# - type: linux_bridge
#   name: br-ex
#   members: [nic2v0]
#   native: External
#   vlans: []
# - type: sriov_pf
#   name: nic2
#   numvfs: 8
# - type: ovs_user_bridge
#   name: br-dpdk
#   members:
#   - type: ovs_dpdk_bond
#     name: dpdkbond0
#     members:
#     - {type: ovs_dpdk_port, name: dpdk0, driver: vfio-pci, members: [nic2v1]}
#     - {type: ovs_dpdk_port, name: dpdk1, driver: vfio-pci, members: [nic2v2]}

# All computes default properties
BridgeMappings: 'datacentre:br-ex'
NetworkVlanRanges: 'datacentre:1:1000'

# ComputeSriov default properties
ComputeSriovProperties:
  isolcpus: '8-19'
  hugepagesz: '1GB'
  hugepages: 32
  kernelargs: 'iommu=pt intel_iommu=on'
  physicaldevmappings: 'datacentre:br-ex,sriov1:ens1f1'
  dedicatedcpus: '8-19'
  sharedcpus: '4-7'
  hostmemory: 8192
  pcipassthrough:
    - devname: ens1f1
      physical_network: 'sriov1'
      trusted: true

# ComputeOvsHwOffload default properties
ComputeOvsHwOffloadProperties:
  isolcpus: '8-19'
  hugepagesz: '1GB'
  hugepages: 32
  kernelargs: 'iommu=pt intel_iommu=on'
  physicaldevmappings: 'datacentre:br-ex,offload1:ens1f1'
  dedicatedcpus: '8-19'
  sharedcpus: '4-7'
  hostmemory: 8192
  pcipassthrough:
    - devname: ens1f1
      physical_network: 'offload1'
      trusted: true

# ComputeOvsDpdk default properties
ComputeOvsDpdkProperties:
  isolcpus: '6-23,30-47'
  hugepagesz: '1GB'
  hugepages: 32
  kernelargs: 'iommu=pt intel_iommu=on'
  dedicatedcpus: '8-23,32-47'
  sharedcpus: '6-7,30-31'
  hostmemory: 8192
  socketmemory: '4096,4096'
  memorychannels: '4'
  ovsdpdkcorelist: '2,26,3,27'
  ovspmdcorelist: '4,28,5,29'

# ComputeOvsDpdkSriov default properties
ComputeOvsDpdkSriovProperties:
  isolcpus: '6-23,30-47'
  hugepagesz: '1GB'
  hugepages: 32
  kernelargs: 'iommu=pt intel_iommu=on'
  dedicatedcpus: '8-23,32-47'
  sharedcpus: '6-7,30-31'
  hostmemory: 8192
  socketmemory: '4096,4096'
  memorychannels: '4'
  ovsdpdkcorelist: '2,26,3,27'
  ovspmdcorelist: '4,28,5,29'
  physicaldevmappings: 'datacentre:br-ex,sriov1:ens1f1'
  pcipassthrough:
    - devname: ens1f1
      physical_network: 'sriov1'
      trusted: true

# CephStorage default properties
CephStorageProperties:
  devices: ['/dev/sdb']

# Run a full `yum update` of the undercloud host on every run (reboots if
# needed). Set to False to skip the upgrade for faster, more predictable runs.
UndercloudFullUpdate: True

# Octavia parameters
DeployOctavia: False

# Designate parameters
DeployDesignate: False

# FRR parameters
DeployFrr: False

# Subscription manager parameters
RegisterNodes: False

# Low Memory Usage parameters
LowMemUsage: True

# Enable fencing for controllers
ControllersFencing: True

# Neutron driver
NeutronDriver: ovn

# Snmpd configuration
SnmpdReadonlyUserPassword: RHOSPVirtLab

# Credentials (lab-only weak defaults).
# These are intentionally weak defaults for a throwaway lab. To use real
# secrets, override any of them in vault_credentials.yaml (gitignored and
# loaded LAST in playbook.yml, so vaulted values win over these defaults):
#   ansible-vault create vault_credentials.yaml
# BMC / IPMI credentials for the virtualbmc VMs and physical nodes
# (consumed via pm.user / pm.password in vars/machines.yml).
BmcUsername: admin
BmcPassword: admin
# Overcloud admin account created by the undercloud.
OvercloudAdminPassword: redhat
OvercloudAdminEmail: admin@example.com
# Password for the test admin user created in overcloud_resources.yaml.
TestUserPassword: redhat
# Passwords baked into each VM's cloud-init (root and the ci_user account).
VmRootPassword: redhat
VmStackPassword: redhat

# Disable telemetry
DisableTelemetry: True

# Telemetry parameters (Set DisableTelemetry to False to use)
Telemetry: False
  # MetricsConnectorHost: default-interconnect-5671-service-telemetry.apps.ocp-sno-for-stf.redhat.local
  # MetricsConnectorIPAddress: 10.8.223.249
