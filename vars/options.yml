---

# RHOSP version
RHOSP_version: 17.1
RHOSP_release: latest

# Custom images: set URL to use a custom image. If it's a local file, use "file://<full_path>"
CustomRhelImage: "{{ RHOSP_version_supported[RHOSP_version].rhel_image.url }}"
CustomCirrOSImage: "{{ CirrOSDownloadLink }}"

# overcloud parameters
external_if: eno1
overcloud_ip: 10.0.0.254
forwarded_ports:
  - 80
  - 6080
  - 5000
vncproxy: ''

# dns and ntp servers
dns_servers:
  - '8.8.8.8'
  - '8.8.4.4'
ntp_servers: 
  - '0.pool.ntp.org'
  - '1.pool.ntp.org'
  - '2.pool.ntp.org'
  - '3.pool.ntp.org'

# Default leaf configuration
leafs:
- name: overcloud
  hypervisor: localhost
  additional_bridges:
  - name: br-external
    interface: null # Optional when external connection is needed
    ipv4:
      address: 10.0.0.254
  ctlplane_bridge:
    name: br-ctlplane
    interface: null # Optional when external connection is needed
  ctlplane_subnet:
    name: ctlplane-subnet
    cidr: 192.168.24.0/24
    dhcp_start: 192.168.24.5
    dhcp_end: 192.168.24.99
    inspection_iprange: 192.168.24.100,192.168.24.120
    gateway: 192.168.24.254
    masquerade: false
  networks:
  - name: Tenant
    bridge: br-ctlplane
    vip: false
    mtu: 1500
    subnet:
      ip_subnet: 172.16.0.0/24
      allocation_pools:
      - start: 172.16.0.5
        end: 172.16.0.99
      vlan: 10
  - name: Storage
    bridge: br-ctlplane
    vip: true
    mtu: 1500
    subnet:
      ip_subnet: 172.16.1.0/24
      allocation_pools:
      - start: 172.16.1.5
        end: 172.16.1.99
      vlan: 11
  - name: InternalApi
    bridge: br-ctlplane
    vip: true
    mtu: 1500
    subnet:
      ip_subnet: 172.16.2.0/24
      allocation_pools:
      - start: 172.16.2.5
        end: 172.16.2.99
      vlan: 12
  - name: StorageMgmt
    bridge: br-ctlplane
    vip: true
    mtu: 1500
    subnet:
      ip_subnet: 172.16.3.0/24
      allocation_pools:
      - start: 172.16.3.5
        end: 172.16.3.99
      vlan: 13
  - name: External
    bridge: br-external
    vip: true
    mtu: 1500
    subnet:
      ip_subnet: 10.0.0.0/24
      allocation_pools:
      - start: 10.0.0.5
        end: 10.0.0.99
      gateway: 10.0.0.254
